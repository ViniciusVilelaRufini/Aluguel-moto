name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'services/api/**'
      - 'apps/admin/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'services/api/**'
      - 'apps/admin/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

env:
  AWS_REGION: sa-east-1

jobs:
  # Gate before any deploy: API (lint + unit tests), admin panel (lint + vitest) and the OpenAPI contract (redocly).
  checks:
    name: lint + tests (api, admin, contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: contract (redocly)
        run: pnpm --filter @volti/contracts lint
      - name: api lint
        run: pnpm --filter api lint
      - name: api unit tests
        run: pnpm --filter api test
      - name: admin lint
        run: pnpm --filter admin lint
      - name: admin tests (vitest)
        run: pnpm --filter admin test

  # Runs on pull_request too: no AWS credentials, fake account 000000000000 (no context lookups).
  synth:
    name: test + synth (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter infra test
        if: matrix.env == 'dev'
      - name: cdk synth
        # prod exige domainName (link público do SOS em https://api.<domínio>/share).
        run: pnpm --filter infra exec cdk synth -c env=${{ matrix.env }} -c account=${{ vars.AWS_ACCOUNT_ID || '000000000000' }} -c domainName=${{ vars.DOMAIN_NAME || 'volti.example' }} -q

  deploy-dev:
    name: deploy (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, synth]
    runs-on: ubuntu-latest
    environment: dev
    concurrency: infra-deploy-dev
    permissions:
      contents: read
      id-token: write   # OIDC for the deploy role (trust limited to environment:dev)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      # Diff against the real account only here: push to main, environment dev, deploy role. No pull_request job gets AWS credentials.
      - name: cdk diff
        run: >
          pnpm --filter infra exec cdk diff --all -c env=dev
          -c account=${{ vars.AWS_ACCOUNT_ID }}
          -c certificateArn=${{ vars.CERTIFICATE_ARN_DEV }}
      # 1) Infra first with the API service at 0 tasks: safe on a fresh account (ECR is empty).
      - name: cdk deploy (service at 0 tasks)
        run: >
          pnpm --filter infra exec cdk deploy --all --require-approval never -c env=dev
          -c account=${{ vars.AWS_ACCOUNT_ID }}
          -c certificateArn=${{ vars.CERTIFICATE_ARN_DEV }}
          -c apiImageTag=${{ github.sha }}
          -c apiDesiredCount=0
      # 2) Build and push the API image only when services/api has a Dockerfile.
      - name: check API Dockerfile
        id: api
        run: |
          if [ -f services/api/Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr
        if: steps.api.outputs.present == 'true'
      - name: build and push API image
        if: steps.api.outputs.present == 'true'
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/volti-dev-api"
          # The Dockerfile copies the workspace files (pnpm-lock.yaml, tsconfig.base.json): build from the repo root.
          docker build -f services/api/Dockerfile -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"
      # 3) Redeploy with the service running, now that the image tag exists.
      - name: cdk deploy (service running)
        if: steps.api.outputs.present == 'true'
        run: >
          pnpm --filter infra exec cdk deploy --all --require-approval never -c env=dev
          -c account=${{ vars.AWS_ACCOUNT_ID }}
          -c certificateArn=${{ vars.CERTIFICATE_ARN_DEV }}
          -c apiImageTag=${{ github.sha }}
          -c apiDesiredCount=1
