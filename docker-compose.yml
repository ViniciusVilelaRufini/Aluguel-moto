name: volti
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: volti
      POSTGRES_PASSWORD: volti
      POSTGRES_DB: volti
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./infra/postgres/traccar-db.sql:/docker-entrypoint-initdb.d/20-traccar.sql:ro]
    healthcheck:
      # TCP (127.0.0.1): o socket unix já aceita conexões durante o init do volume (scripts de initdb ainda rodando).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U volti"]
      interval: 5s
      start_period: 10s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  minio:
    # A MinIO deixou de publicar imagens no Docker Hub/quay (2025); bitnamilegacy é a última imagem pública compatível.
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: volti
      MINIO_ROOT_PASSWORD: volti-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    # Sobe sem .env: padrões de desenvolvimento via ${VAR:-padrão} (o shell/.env da raiz pode sobrescrever).
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-troque-este-segredo-local}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      QUEUE_MODE: ${QUEUE_MODE:-local}
      IOT_MODE: ${IOT_MODE:-local}
      GEOFENCE_MODE: ${GEOFENCE_MODE:-local}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      INSURANCE_PROVIDER: ${INSURANCE_PROVIDER:-mock}
      KYC_PROVIDER: ${KYC_PROVIDER:-mock}
      PUSH_MODE: ${PUSH_MODE:-log}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-volti}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-volti-dev-secret}
      DATABASE_URL: postgresql://volti:volti@postgres:5432/volti
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    ports: ["${API_PORT:-3000}:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
      minio:
        condition: service_started
  # Simulador de rastreadores (Task 4): docker compose --profile sim up -d iot-sim
  iot-sim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: services/iot-sim/Dockerfile
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SIM_VEHICLES: ${SIM_VEHICLES:-50}
      SIM_FIRST_VEHICLE: ${SIM_FIRST_VEHICLE:-1}
      SIM_RIDING_RATIO: ${SIM_RIDING_RATIO:-0.6}
      SIM_EVENTS: ${SIM_EVENTS:-}
      SIM_INJECT: ${SIM_INJECT:-}
    depends_on:
      mosquitto:
        condition: service_started
  # Rastreador GT06 só relé (docs/superpowers/specs/2026-10-27-volti-rastreador-gt06-relay-only.md):
  #   docker compose --profile gt06 up -d traccar bridge-db-grants traccar-bridge gt06-emulator   (a API precisa ter migrado antes)
  # Banco "traccar" separado no mesmo Postgres. Portas só em localhost: 5023 (GT06) e 8082 (painel/REST do Traccar).
  traccar:
    profiles: ["gt06"]
    image: traccar/traccar:6.16.0-ubuntu
    restart: unless-stopped
    mem_limit: 768m
    entrypoint: ["java", "-Xms128m", "-Xmx512m", "-Djava.net.preferIPv4Stack=true"]
    command: ["-jar", "tracker-server.jar", "conf/traccar.xml"]
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      # sslmode=prefer: usa TLS se o Postgres local oferecer (a imagem padrão não oferece) e cai para texto claro; no AWS é require.
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar?sslmode=prefer
      DATABASE_USER: traccar
      DATABASE_PASSWORD: traccar
      PROTOCOLS_ENABLE: gt06
      GT06_PORT: "5023"
      WEB_PORT: "8082"
    ports: ["127.0.0.1:5023:5023", "127.0.0.1:8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy
  # Uma vez só: GRANT SELECT por coluna em "Tracker" para o papel volti_bridge. Espera a API migrar (até ~5 min).
  bridge-db-grants:
    profiles: ["gt06"]
    image: postgis/postgis:16-3.4
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: volti
      PGPASSWORD: volti
      PGDATABASE: volti
    volumes: ["./infra/postgres/bridge-grants.sql:/bridge-grants.sql:ro"]
    entrypoint: ["sh", "-c", "for i in $$(seq 1 100); do [ -n \"$$(psql -tAc \"select to_regclass('\\\"Tracker\\\"')\")\" ] && exec psql -v ON_ERROR_STOP=1 -f /bridge-grants.sql; sleep 3; done; echo 'tabela Tracker ausente: suba a API (migrações) antes' >&2; exit 1"]
    depends_on:
      postgres:
        condition: service_healthy
  # Ponte Traccar -> MQTT; no local ela cria o primeiro usuário do Traccar (admin) com estas credenciais.
  traccar-bridge:
    profiles: ["gt06"]
    build:
      context: .
      dockerfile: services/traccar-bridge/Dockerfile
    image: volti/traccar-bridge:local
    restart: unless-stopped
    environment:
      IOT_MODE: local
      MQTT_URL: mqtt://mosquitto:1883
      TRACCAR_URL: http://traccar:8082
      TRACCAR_EMAIL: ${TRACCAR_EMAIL:-admin@volti.local}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:-volti-dev-traccar}
      TRACCAR_BOOTSTRAP_ADMIN: "true"
      DATABASE_URL: postgresql://volti_bridge:volti-bridge-local@postgres:5432/volti
      BATTERY_MODEL: ${GT06_BATTERY_MODEL:-72v}
    # B-I3: o arquivo de vida só avança com a fila de entrada da ponte andando (mesmo HEALTHCHECK do Dockerfile). O Docker não
    # reinicia contêiner unhealthy sozinho: o estado aparece em `docker ps` / `docker inspect` (no ECS a task é substituída).
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      bridge-db-grants:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
      traccar:
        condition: service_started
  # Emulador GT06 (mesma imagem da ponte): GT06_SCENARIO=parked (padrão) ou ride-then-stop. A tensão segue BATTERY_MODEL.
  gt06-emulator:
    profiles: ["gt06"]
    build:
      context: .
      dockerfile: services/traccar-bridge/Dockerfile
    image: volti/traccar-bridge:local
    restart: unless-stopped
    command: ["node", "dist/gt06/emulator-main.js"]
    # Mesma imagem da ponte: sem arquivo de vida, o HEALTHCHECK herdado do Dockerfile não vale para o emulador.
    healthcheck:
      disable: true
    environment:
      GT06_HOST: traccar
      GT06_PORT: "5023"
      GT06_IMEI: ${GT06_EMULATOR_IMEI:-860000000000901}
      GT06_SCENARIO: ${GT06_SCENARIO:-parked}
      BATTERY_MODEL: ${GT06_BATTERY_MODEL:-72v}
    depends_on:
      traccar:
        condition: service_started
volumes:
  pgdata:
  miniodata:
