name: volti
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: volti
      POSTGRES_PASSWORD: volti
      POSTGRES_DB: volti
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volti"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: volti
      MINIO_ROOT_PASSWORD: volti-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 volti volti-dev-secret; do sleep 1; done;
      for b in documentos-kyc fotos-devolucao relatorios anexos; do mc mb --ignore-existing local/$$b; done"
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://volti:volti@postgres:5432/volti
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
      minio:
        condition: service_started
volumes:
  pgdata:
  miniodata:
