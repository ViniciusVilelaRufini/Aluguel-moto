<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.sw i{display:block;height:64px;border-radius:14px}.sw b{display:block;font:600 12px/1.3 var(--font-sans);margin-top:6px}.sw code{font:500 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--coral-500);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>Coral</b><code>--coral-500</code></div><div class="sw"><i style="background:var(--coral-50);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>Coral soft</b><code>--coral-50</code></div><div class="sw"><i style="background:var(--orange-500);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>Laranja</b><code>--orange-500</code></div><div class="sw"><i style="background:var(--blue-500);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>Azul</b><code>--blue-500</code></div><div class="sw"><i style="background:var(--blue-50);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>Azul soft</b><code>--blue-50</code></div><div class="sw"><i style="background:var(--sky-100);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>Céu</b><code>--sky-100</code></div><div class="sw"><i style="background:var(--sun-300);"></i><b>Sol</b><code>--sun-300</code></div></div></body></html>
