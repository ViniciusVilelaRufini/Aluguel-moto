<!-- @dsCard group="Spacing" viewport="700x170" name="Motion presets" subtitle="Keyframes vt-* em tokens/motion.css: pin, pulso, ripple, toast, troca de tela" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.c{height:96px;border-radius:16px;background:var(--ink-50);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.l{font:500 11px/1.3 var(--font-mono);color:var(--ink-500);margin-top:6px;text-align:center}.loop{animation-iteration-count:infinite!important}</style></head><body><div class="g">
<div><div class="c"><span class="loop" style="width:30px;height:30px;border-radius:50%;background:var(--ink-900);border:2.5px solid #fff;box-shadow:var(--shadow-1);animation:vt-marker-in 1.6s var(--ease-spring) infinite"></span></div><div class="l">vt-marker-in</div></div>
<div><div class="c"><span style="position:relative;width:22px;height:22px"><span style="position:absolute;inset:0;border-radius:50%;background:var(--brand);animation:vt-pulse-ring 2s var(--ease-out) infinite"></span><span style="position:absolute;inset:0;border-radius:50%;background:var(--brand);border:4px solid #fff;box-sizing:border-box"></span></span></div><div class="l">vt-pulse-ring</div></div>
<div><div class="c"><span style="position:relative;overflow:hidden;isolation:isolate;height:40px;padding:0 18px;border-radius:999px;background:var(--brand);color:#fff;display:flex;align-items:center;font:600 13px var(--font-sans)"><span style="position:absolute;left:10px;top:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.38);animation:vt-ripple 1.4s var(--ease-out) infinite;z-index:-1"></span>Ripple</span></div><div class="l">vt-ripple</div></div>
<div><div class="c"><span style="height:36px;padding:0 14px;border-radius:12px;background:var(--ink-900);color:#fff;display:flex;align-items:center;font:600 12px var(--font-sans);animation:vt-toast-in 1.6s var(--ease-spring) infinite">Moto destravada</span></div><div class="l">vt-toast-in</div></div>
<div><div class="c" style="background:var(--ink-900)"><span style="position:absolute;inset:14px 28px;border-radius:10px;background:var(--ink-200)"></span><span style="position:absolute;inset:14px 28px;border-radius:10px;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.3);animation:vt-screen-in-right 1.8s var(--ease-screen) infinite"></span></div><div class="l">vt-screen-in-right</div></div>
</div></body></html>
