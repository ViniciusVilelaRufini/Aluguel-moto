<!-- @dsCard group="Colors" viewport="700x150" name="Semantic aliases" subtitle="Use estes nos componentes, não a escala crua" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.sw i{display:block;height:64px;border-radius:14px}.sw b{display:block;font:600 12px/1.3 var(--font-sans);margin-top:6px}.sw code{font:500 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--brand);"></i><b>brand</b><code>--brand</code></div><div class="sw"><i style="background:var(--surface-card);"></i><b>surface-card</b><code>--surface-card</code></div><div class="sw"><i style="background:var(--surface-sunken);"></i><b>surface-sunken</b><code>--surface-sunken</code></div><div class="sw"><i style="background:var(--surface-inverse);"></i><b>surface-inverse</b><code>--surface-inverse</code></div><div class="sw"><i style="background:var(--success);"></i><b>success</b><code>--success</code></div><div class="sw"><i style="background:var(--danger);"></i><b>danger</b><code>--danger</code></div><div class="sw"><i style="background:var(--warning);"></i><b>warning</b><code>--warning</code></div><div class="sw"><i style="background:var(--info);"></i><b>info</b><code>--info</code></div></div></body></html>
