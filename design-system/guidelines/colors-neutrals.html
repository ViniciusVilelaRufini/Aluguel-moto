<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.sw i{display:block;height:64px;border-radius:14px}.sw b{display:block;font:600 12px/1.3 var(--font-sans);margin-top:6px}.sw code{font:500 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--ink-900);"></i><b>900</b><code>--ink-900</code></div><div class="sw"><i style="background:var(--ink-700);"></i><b>700</b><code>--ink-700</code></div><div class="sw"><i style="background:var(--ink-500);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>500</b><code>--ink-500</code></div><div class="sw"><i style="background:var(--ink-400);"></i><b>400</b><code>--ink-400</code></div><div class="sw"><i style="background:var(--ink-300);"></i><b>300</b><code>--ink-300</code></div><div class="sw"><i style="background:var(--ink-200);"></i><b>200</b><code>--ink-200</code></div><div class="sw"><i style="background:var(--ink-100);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>100</b><code>--ink-100</code></div><div class="sw"><i style="background:var(--ink-50);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>50</b><code>--ink-50</code></div></div></body></html>
