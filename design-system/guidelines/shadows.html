<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.sw i{display:block;height:64px;border-radius:14px}.sw b{display:block;font:600 12px/1.3 var(--font-sans);margin-top:6px}.sw code{font:500 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row" style="padding:10px 4px 20px;gap:22px"><div style="flex:1;text-align:center"><div style="height:64px;border-radius:20px;background:#fff;box-shadow:var(--shadow-1)"></div><code style="display:block;margin-top:12px;font:500 11px var(--font-mono);color:var(--ink-500)">--shadow-1</code></div><div style="flex:1;text-align:center"><div style="height:64px;border-radius:20px;background:#fff;box-shadow:var(--shadow-2)"></div><code style="display:block;margin-top:12px;font:500 11px var(--font-mono);color:var(--ink-500)">--shadow-2</code></div><div style="flex:1;text-align:center"><div style="height:64px;border-radius:20px;background:#fff;box-shadow:var(--shadow-sheet)"></div><code style="display:block;margin-top:12px;font:500 11px var(--font-mono);color:var(--ink-500)">--shadow-sheet</code></div><div style="flex:1;text-align:center"><div style="height:64px;border-radius:20px;background:var(--brand);box-shadow:var(--shadow-brand)"></div><code style="display:block;margin-top:12px;font:500 11px var(--font-mono);color:var(--ink-500)">--shadow-brand</code></div><div style="flex:1;text-align:center"><div style="height:64px;border-radius:20px;background:var(--danger);box-shadow:var(--shadow-coral)"></div><code style="display:block;margin-top:12px;font:500 11px var(--font-mono);color:var(--ink-500)">--shadow-coral</code></div></div></body></html>
