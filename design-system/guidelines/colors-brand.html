<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.sw i{display:block;height:64px;border-radius:14px}.sw b{display:block;font:600 12px/1.3 var(--font-sans);margin-top:6px}.sw code{font:500 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--green-50);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>50</b><code>--green-50</code></div><div class="sw"><i style="background:var(--green-100);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>100</b><code>--green-100</code></div><div class="sw"><i style="background:var(--green-300);"></i><b>300</b><code>--green-300</code></div><div class="sw"><i style="background:var(--green-500);box-shadow:inset 0 0 0 1px var(--ink-200)"></i><b>500 · brand</b><code>--green-500</code></div><div class="sw"><i style="background:var(--green-600);"></i><b>600 · hover</b><code>--green-600</code></div><div class="sw"><i style="background:var(--green-700);"></i><b>700 · press</b><code>--green-700</code></div><div class="sw"><i style="background:var(--green-900);"></i><b>900</b><code>--green-900</code></div></div></body></html>
