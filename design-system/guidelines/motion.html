<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="ease-out 200ms padrão · spring em knobs e pins · sheet 320ms" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.sw i{display:block;height:64px;border-radius:14px}.sw b{display:block;font:600 12px/1.3 var(--font-sans);margin-top:6px}.sw code{font:500 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><style>.t{height:10px;border-radius:5px;background:var(--ink-100);position:relative;margin:14px 0 4px}.t span{position:absolute;top:-7px;left:0;width:24px;height:24px;border-radius:50%;background:var(--brand);animation:m 1.6s infinite alternate}@keyframes m{to{left:calc(100% - 24px)}}</style><div style="display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:center"><code style="font:500 11px var(--font-mono)">--ease-out</code><div class="t"><span style="animation-timing-function:cubic-bezier(.2,.8,.2,1)"></span></div></div><div style="display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:center"><code style="font:500 11px var(--font-mono)">--ease-spring</code><div class="t"><span style="animation-timing-function:cubic-bezier(.34,1.56,.64,1)"></span></div></div><div style="display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:center"><code style="font:500 11px var(--font-mono)">--ease-in-out</code><div class="t"><span style="animation-timing-function:cubic-bezier(.65,0,.35,1)"></span></div></div></body></html>
