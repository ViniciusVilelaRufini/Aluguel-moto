name: volti_cliente
description: App do cliente Volti (aluguel de motos eletricas sem CNH).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.7.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  socket_io_client: ^3.0.0
  geolocator: ^14.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  url_launcher: ^6.3.0
  share_plus: ^11.0.0
  lucide_icons_flutter: ^3.0.0
  volti_flutter:
    path: ../../packages/volti_flutter
  volti_api:
    path: ../../packages/contracts/generated/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
