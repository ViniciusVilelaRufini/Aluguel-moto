name: volti_operador
description: "App do operador de campo Volti"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  dio: ^5.7.0
  built_collection: ^5.1.1
  hive_ce: ^2.11.0
  path_provider: ^2.1.0
  connectivity_plus: ^7.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.0
  url_launcher: ^6.3.0
  lucide_icons_flutter: ^3.0.0
  volti_flutter:
    path: ../../packages/volti_flutter
  volti_api:
    path: ../../packages/contracts/generated/dart
  geolocator: ^14.0.1
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#34C25C"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/wordmark.png
  color_dark: "#15181A"
  android_12:
    color: "#34C25C"
    icon_background_color: "#34C25C"
    image: assets/branding/icon_foreground.png
