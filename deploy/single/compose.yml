# Volti dev em UMA instância EC2 (profile=single, infra/lib/stacks/single-dev-stack.ts).
# Rodado por deploy/single/update.sh com: docker compose -f deploy/single/compose.yml --env-file /opt/volti/.env ...
# /opt/volti/.env é gerado por render-env.sh a partir do SSM (/volti/dev/config/* e /volti/dev/secrets/*); nada secreto aqui.
# IMDS (Run-2): só a API (IP fixo 172.30.0.10) alcança a role da instância; o imds-guard.sh descarta o resto na DOCKER-USER.
# Os outros serviços ficam sem NET_RAW (sem pacote cru, ninguém se passa pelo IP da API na rede).
name: volti

services:
  postgres:
    build: ./postgis
    image: volti/postgis:16
    restart: unless-stopped
    cap_drop: [NET_RAW]
    environment:
      POSTGRES_USER: volti
      POSTGRES_DB: volti
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ausente (rode render-env.sh)}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volti -d volti"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    cap_drop: [NET_RAW]
    # noeviction: a API guarda estado de segurança sem TTL (mesma política do ElastiCache do prod); AOF para sobreviver a reboot.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    cap_drop: [NET_RAW]
    # Só na rede interna do Compose (porta não publicada): IOT_MODE=local, rastreadores simulados.
    volumes: ["../../infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: volti/api:dev
    restart: unless-stopped
    # Único container com IMDS (S3 presign, Cognito Admin*): o imds-guard.sh libera só este IP na DOCKER-USER.
    networks:
      default:
        ipv4_address: 172.30.0.10
    env_file: [/opt/volti/.env]
    environment:
      NODE_ENV: production
      PORT: "3000"
      VOLTI_ENV: dev
      DATABASE_URL: postgresql://volti:${DB_PASSWORD}@postgres:5432/volti
      REDIS_URL: redis://redis:6379
      # As migrações rodam no update.sh (prisma migrate deploy) antes de subir a nova imagem.
      RUN_MIGRATIONS: "false"
      AUTH_MODE: cognito
      STORAGE_MODE: s3
      IOT_MODE: local
      MQTT_URL: mqtt://mosquitto:1883
      GEOFENCE_MODE: local
      GEOCODER_MODE: local
      QUEUE_MODE: local
      PAYMENT_PROVIDER: fake
      ALLOW_FAKE_PAYMENTS: "true"
      # Entrega simulada para o app de teste (POST /reservations/{id}/test-handover); só com o pagamento fake liberado.
      ALLOW_TEST_HANDOVER: "true"
      INSURANCE_PROVIDER: mock
      INVOICE_ISSUER: mock
      KYC_PROVIDER: mock
      PUSH_MODE: log
      TRACK_RETENTION_DAYS: "90"
      OUT_OF_AREA_LOCK_MINUTES: "5"
      TRUST_PROXY: "1"
      PUBLIC_SHARE_BASE_URL: https://${PUBLIC_HOST}/share
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started

  # prisma migrate deploy (update.sh) antes de trocar a API: mesma imagem, sem o IP fixo (o da API em execução), sem IMDS e
  # só com o DATABASE_URL (não recebe o .env inteiro).
  api-migrate:
    profiles: ["migrate"]
    image: volti/api:dev
    cap_drop: [NET_RAW]
    environment:
      DATABASE_URL: postgresql://volti:${DB_PASSWORD}@postgres:5432/volti
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [NET_RAW]
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]

  # Rastreador GT06 só relé (profile "gt06", ligado por /volti/dev/config/GT06=on; spec 2026-10-27-volti-rastreador-gt06-relay-only).
  # Banco "traccar" e papéis traccar/volti_bridge criados pelo deploy/single/gt06.sh init (update.sh, depois das migrações).
  # REST/painel só em 127.0.0.1:8082 (SSM port forwarding); GT06 na 5023, que o security group só abre com -c gt06Port=true
  # e origem explícita. t4g.small (2 GiB, arm64; a tag -ubuntu publica arm64): memória limitada e heap fixo. Mesma imagem do
  # docker-compose.yml local e do CDK (TRACCAR_IMAGE, >= 6.7.0 pelo noQueue da ponte). Sem IP fixo: cai no DROP do imds-guard.sh.
  traccar:
    profiles: ["gt06"]
    image: traccar/traccar:6.16.0-ubuntu
    restart: unless-stopped
    cap_drop: [NET_RAW]
    mem_limit: 640m
    # Sob pressão de memória, o OOM killer escolhe este antes da API e do Postgres.
    oom_score_adj: 500
    entrypoint: ["/opt/traccar/jre/bin/java", "-XX:+ExitOnOutOfMemoryError", "-Xms128m", "-Xmx320m", "-Djava.net.preferIPv4Stack=true"]
    command: ["-jar", "tracker-server.jar", "conf/traccar.xml"]
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      # sslmode=prefer: o Postgres do dev single (postgres:16-bookworm) não tem TLS; tráfego só na rede interna do Compose.
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar?sslmode=prefer
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD:?TRACCAR_DB_PASSWORD ausente (rode render-env.sh)}
      PROTOCOLS_ENABLE: gt06
      GT06_PORT: "5023"
      WEB_PORT: "8082"
    # GT06_BIND (/volti/dev/config/GT06_BIND): 127.0.0.1 por padrão (o emulador usa traccar:5023 pela rede interna). 0.0.0.0
    # só para um J16 real, junto com -c gt06Port=true no security group (cloudshell.md).
    ports: ["${GT06_BIND:-127.0.0.1}:5023:5023", "127.0.0.1:8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy

  # Ponte Traccar -> MQTT (services/traccar-bridge): Mosquitto, Traccar (rede interna; /api/server para o gate de versão) e
  # Postgres com o papel volti_bridge (SELECT em 3 colunas de "Tracker"). Usuário próprio no Traccar (não admin; os
  # dispositivos são ligados a ele pelo gt06.sh provision). Recebe só as duas senhas dela, não o .env inteiro. Logs sem IMEI.
  traccar-bridge:
    profiles: ["gt06"]
    build:
      context: ../..
      dockerfile: services/traccar-bridge/Dockerfile
    image: volti/traccar-bridge:dev
    restart: unless-stopped
    cap_drop: [NET_RAW]
    mem_limit: 160m
    # Sob pressão de memória, o OOM killer escolhe este antes da API e do Postgres.
    oom_score_adj: 500
    environment:
      IOT_MODE: local
      MQTT_URL: mqtt://mosquitto:1883
      TRACCAR_URL: http://traccar:8082
      TRACCAR_EMAIL: bridge@volti.local
      TRACCAR_PASSWORD: ${TRACCAR_BRIDGE_PASSWORD:?TRACCAR_BRIDGE_PASSWORD ausente (rode render-env.sh)}
      DATABASE_URL: postgresql://volti_bridge:${BRIDGE_DB_PASSWORD:?BRIDGE_DB_PASSWORD ausente (rode render-env.sh)}@postgres:5432/volti
      BATTERY_MODEL: ${GT06_BATTERY_MODEL:-72v}
    # B-I3: o arquivo de vida só avança com a fila de entrada da ponte andando (mesmo HEALTHCHECK do Dockerfile). O Docker não
    # reinicia contêiner unhealthy sozinho: o estado aparece em `docker ps` / `docker inspect` (no ECS a task é substituída).
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      traccar:
        condition: service_started

  # Emulador GT06 (imagem da ponte, construída pelo serviço acima) para o e2e: GT06_SCENARIO=parked (padrão) ou
  # ride-then-stop (gt06.sh e2e). A tensão segue BATTERY_MODEL. Nenhum segredo.
  gt06-emulator:
    profiles: ["gt06"]
    image: volti/traccar-bridge:dev
    restart: unless-stopped
    cap_drop: [NET_RAW]
    mem_limit: 96m
    # Sob pressão de memória, o OOM killer escolhe este antes da API e do Postgres.
    oom_score_adj: 500
    command: ["node", "dist/gt06/emulator-main.js"]
    # Mesma imagem da ponte: sem arquivo de vida, o HEALTHCHECK herdado do Dockerfile não vale para o emulador.
    healthcheck:
      disable: true
    environment:
      GT06_HOST: traccar
      GT06_PORT: "5023"
      GT06_IMEI: ${GT06_EMULATOR_IMEI:-860000000000901}
      GT06_SCENARIO: ${GT06_SCENARIO:-parked}
      BATTERY_MODEL: ${GT06_BATTERY_MODEL:-72v}
    depends_on:
      traccar:
        condition: service_started

  # Simulador de rastreadores (dev sem rastreador real): um rastreador por moto cadastrada, na posição dela (no galpão, a do
  # galpão), parado, respondendo pelo shadow como o firmware (trava só < 3 km/h, limite <= 32 km/h). Liga/desliga pelo
  # parâmetro /volti/dev/config/IOT_SIM (on, o padrão, ou off): o update.sh ativa o profile "sim" conforme o valor.
  # Só lê o banco (SELECT) e recebe só a senha do Postgres, não o .env inteiro.
  iot-sim:
    profiles: ["sim"]
    build:
      context: ../..
      dockerfile: services/iot-sim/Dockerfile
    image: volti/iot-sim:dev
    restart: unless-stopped
    cap_drop: [NET_RAW]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SIM_FLEET_SOURCE: postgres
      DATABASE_URL: postgresql://volti:${DB_PASSWORD}@postgres:5432/volti
      SIM_FLEET_REFRESH_SEC: "60"
      # false: destravada, a moto fica parada onde está (ninguém pilota no dev). true: um piloto simulado anda perto dali.
      SIM_RIDE_ON_UNLOCK: ${SIM_RIDE_ON_UNLOCK:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

# Uma rede só (os nomes dos serviços continuam resolvendo entre si). Nome próprio: a volti_default antiga tinha outra sub-rede
# (o update.sh a remove). IPs dinâmicos só em .128-.255, então nenhum outro container pega o .10 da API.
networks:
  default:
    name: volti-dev
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
