# Mosquitto do dev single (deploy/single/compose.yml), IOT_MODE=local. Auditoria run-4 (onda 2): sem anônimo; cada serviço
# entra com usuário e senha próprios e só alcança os tópicos do papel dele (acl). O arquivo de senhas é gerado no start
# (start.sh) a partir das senhas que o render-env.sh trouxe do SSM. O dev no PC (docker-compose.yml da raiz) segue anônimo,
# só em 127.0.0.1 (infra/mosquitto/mosquitto.conf).
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl
persistence false
