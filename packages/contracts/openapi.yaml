        toStatus: { $ref: '#/components/schemas/BatteryStatus' }
        depotId: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        actorId: { type: string, format: uuid, description: Staff que fez a movimentação (cliente na troca por QR). }
        reason: { type: string }
