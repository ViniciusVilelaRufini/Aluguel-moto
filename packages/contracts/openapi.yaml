        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /field-tasks/{id}/inspection:
    post:
      tags: [field-tasks]
      operationId: submitInspection
      summary: Registrar checklist de inspeção
      description: |
        Usuário só do grupo `campo` só registra em tarefa atribuída a ele (`403`).
        Todos os itens são obrigatórios e é preciso ao menos uma foto. O limitador de velocidade é
        observado em `configuredMaxKmh` (valor lido no controlador, 0 a 100). Se `configuredMaxKmh > 32`:
        `speedLimiter.ok: true` é recusado (`422` `speed-limiter-noncompliant`); com `ok: false` a inspeção é
        registrada e a API abre automaticamente uma manutenção corretiva e um alerta, e muda a moto para
        `maintenance`. `recordedAt` é o instante
        real do preenchimento (pode ser anterior ao envio, no modo offline). Reenvio com a mesma
        `Idempotency-Key` não duplica.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionRequest' }
      responses:
        '201':
          description: Inspeção registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /field-tasks/{id}/battery-swap:
    post:
      tags: [field-tasks]
      operationId: submitBatterySwap
      summary: Registrar troca de bateria
      description: Usuário só do grupo `campo` só registra em tarefa atribuída a ele (`403`). Números de série da bateria retirada e da instalada (lidos por QR ou código de barras); precisam ser diferentes (`422` `battery-serials-must-differ`). Reenvio com a mesma `Idempotency-Key` não duplica.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatterySwapRequest' }
      responses:
        '201':
          description: Troca registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatterySwap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /vehicles/{id}/service-unlock:
    post:
      tags: [field-tasks]
      operationId: serviceUnlockVehicle
      summary: Destravar em modo serviço
      description: Destrava sem cobrança para o operador de campo, sem aluguel. Recusa (`409` `vehicle-unavailable`) moto com aluguel aberto ou reserva ativa, mesmo que esteja `offline`. `fieldTaskId`, se informado, precisa ser uma tarefa desta moto (`409`) e, para usuário só do grupo `campo`, atribuída a ele (`403`). Grava AuditLog (quem, quando, motivo, tarefa). Responde com o comando `unlock` criado.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceUnlockRequest' }
      responses:
        '202':
          description: Comando aceito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleCommand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── maintenance ─────────────────────────────
  /maintenance/vehicles:
    get:
      tags: [maintenance]
      operationId: listVehicleServiceStatus
      summary: Manutenção preventiva por km/horas (tabela "Manutenção")
      description: |
        Uma linha por moto com odômetro, horas de uso, km/horas desde a última revisão, próxima revisão e situação
        (`overdue` → `due_soon` → `ok`, depois por código). Intervalos do modelo (`VehicleModel.serviceIntervalKm`/
        `serviceIntervalHours`; padrão 1000 km / 100 h). `due_soon` quando faltam 10% ou menos de qualquer intervalo.
        Revisão registrada = manutenção `preventive` concluída (`PATCH /maintenance/tasks/{id}` com `status: done`).
        "Agendar" usa `POST /maintenance/tasks` com o `vehicleId` da linha; a linha mostra a manutenção em aberto.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/VehicleServiceStatus' }
        - name: q
          in: query
          description: Busca por código da moto.
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Página de motos com a situação da revisão.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleServicePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /maintenance/tasks:
    get:
      tags: [maintenance]
      operationId: listMaintenanceTasks
      summary: Listar manutenções
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MaintenanceStatus' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/MaintenanceKind' }
        - name: vehicleId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de manutenções.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [maintenance]
      operationId: createMaintenanceTask
      summary: Agendar manutenção
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceTaskCreate' }
      responses:
        '201':
          description: Manutenção criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /maintenance/tasks/{id}:
    get:
      tags: [maintenance]
      operationId: getMaintenanceTask
      summary: Detalhe da manutenção
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Manutenção.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [maintenance]
      operationId: updateMaintenanceTask
      summary: Atualizar manutenção
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceTaskUpdate' }
      responses:
        '200':
          description: Manutenção atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  # ───────────────────────────── batteries ─────────────────────────────
  /batteries:
    get:
      tags: [batteries]
      operationId: listBatteries
      summary: Baterias (série, carga, ciclos, onde estão)
      description: |
        `statusCounts` traz a contagem por status de todas as baterias que passam nos filtros `depotId`, `holderId` e `q`
        (ignora `status` e a paginação), para o resumo do inventário.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BatteryStatus' }
        - name: depotId
          in: query
          description: Galpão onde a bateria está (`charging`, `charged` ou `defective`).
          schema: { type: string, format: uuid }
        - name: holderId
          in: query
          description: Operador que leva a bateria na van (`me` = o próprio usuário).
          schema: { type: string, pattern: '^(me|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$' }
        - name: q
          in: query
          description: Busca por número de série.
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Página de baterias.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatteryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [batteries]
      operationId: createBattery
      summary: Cadastrar bateria no galpão
      description: |
        Cadastra uma bateria nova pelo número de série, no galpão `depotId`, como `charging` (carregando) ou `charged`
        (carregada, `chargePct` 100). Série já cadastrada → `409`; galpão inexistente → `404`; galpão inativo → `422`
        `depot-inactive`. Grava a primeira movimentação (`fromStatus` ausente).
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatteryCreateRequest' }
      responses:
        '201':
          description: Bateria cadastrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Battery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /batteries/{id}/mark-charged:
    post:
      tags: [batteries]
      operationId: markBatteryCharged
      summary: Marcar bateria como carregada
      description: |
        `charging` → `charged` com `chargePct` 100, no mesmo galpão. Bateria carregando numa estação de troca (devolvida
        por QR: `stationId` sem `depotId`) volta a `in_station` e conta de novo nas disponíveis da estação. Outro status → `409`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Bateria carregada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Battery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /batteries/{id}/report-defect:
    post:
      tags: [batteries]
      operationId: reportBatteryDefect
      summary: Registrar defeito na bateria
      description: |
        De `charging`, `charged`, `in_van` ou `in_station` → `defective` (fora de uso). Bateria instalada numa moto → `409`
        (retire-a da moto antes); já `defective` ou `retired` → `409`. Na estação, uma bateria carregada deixa de contar
        como disponível.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatteryDefectRequest' }
      responses:
        '200':
          description: Bateria com defeito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Battery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /batteries/{id}/retire:
    post:
      tags: [batteries]
      operationId: retireBattery
      summary: Dar baixa na bateria
      description: De `defective`, `charging` ou `charged` → `retired` (definitivo). Outro status → `409`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatteryRetireRequest' }
      responses:
        '200':
          description: Bateria baixada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Battery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /batteries/{id}/movements:
    get:
      tags: [batteries]
      operationId: listBatteryMovements
      summary: Histórico de movimentação da bateria
      description: Cada mudança de status (cadastro, van, galpão, moto, estação, troca por QR, defeito, baixa), mais recente primeiro.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de movimentações.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatteryMovementPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /batteries/van-stock:
    get:
      tags: [batteries]
      operationId: getVanStock
      summary: Estoque de baterias na van do operador
      description: |
        Baterias com `status: in_van` do operador (padrão: o próprio usuário; `admin`/`operacao` podem passar
        `operatorId`). Carregada = `chargePct >= 90`. A troca de bateria tira a instalada do estoque e põe a retirada.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - name: operatorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estoque.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VanStock' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /batteries/van-stock/load:
    post:
      tags: [batteries]
      operationId: loadVanBatteries
      summary: Carregar baterias na van
      description: |
        Move as baterias (por série) para a van do usuário (`in_van`). Série desconhecida é cadastrada. Bateria instalada
        numa moto, com defeito (`defective`) ou baixada (`retired`) → `409`. Prefira as `charged` do galpão
        (`GET /batteries?depotId=…&status=charged`); carregar uma `charging` continua permitido: ela vai com a carga
        conhecida (`items[].chargePct`) e a série volta em `loadedChargingSerials`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatteryTransferRequest' }
      responses:
        '200':
          description: Estoque atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VanStock' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /batteries/van-stock/unload:
    post:
      tags: [batteries]
      operationId: unloadVanBatteries
      summary: Descarregar baterias da van
      description: |
        Tira da van do usuário: para uma estação (`in_station`, com `stationId`) ou para carregar no galpão (`charging`
        com `depotId`). Sem `stationId` e sem `depotId`, usa o único galpão ativo; com mais de um (ou nenhum) → `422`
        `depot-required`. Bateria fora da van do usuário → `409`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatteryTransferRequest' }
      responses:
        '200':
          description: Estoque atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VanStock' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

