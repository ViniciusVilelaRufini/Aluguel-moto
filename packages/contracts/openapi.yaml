  /alerts/{id}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Detalhe do alerta
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte, financeiro]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Alerta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /alerts/{id}/assign:
    post:
      tags: [alerts]
      operationId: assignAlert
      summary: Atribuir alerta
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte, financeiro]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
