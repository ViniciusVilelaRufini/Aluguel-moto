        serviceIntervalHours: { type: integer, minimum: 1 }
        nextServiceAtKm: { type: number, format: double, minimum: 0, description: Odômetro da próxima revisão. }
        nextServiceAtHours: { type: number, format: double, minimum: 0 }
        kmUntilService: { type: number, format: double, description: Negativo quando vencida. }
        hoursUntilService: { type: number, format: double, description: Negativo quando vencida. }
