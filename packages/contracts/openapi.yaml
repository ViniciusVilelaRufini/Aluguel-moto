      responses:
        '200':
          description: Estorno registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payments/{id}/retry:
    post:
      tags: [payments]
      operationId: payDebt
      summary: Quitar dívida (cliente)
      description: |
        O cliente paga o saldo devedor (`outstandingCents`) de um pagamento de aluguel ou assinatura que terminou `failed`
        (inadimplência). Cria um pagamento `debt_settlement` com `settlesPaymentId` = este id. Cartão: cobrança na hora
        (`201` `paid`; recusa → `402` `payment-failed`; sem cartão → `402` `card-not-found`). Pix: `201` `pending` com `pix`;
        a quitação acontece quando o gateway confirma (webhook). Quitado, o pagamento original ganha `debtSettledAt` e a flag
        `delinquent` sai quando não restar outra dívida e o recibo do aluguel (PDF) fica pronto. Não é dívida (ou já
        quitada) → `409` `debt-not-payable`; cobrança automática ainda em curso → `409` `debt-in-collection` (aluguel: a
        liquidação ainda retenta no cartão; assinatura: a assinatura desta dívida está `past_due`, com o gateway retentando
        a recorrência, ou com o cancelamento no gateway ainda não confirmado). Uma quitação Pix pendente e ainda válida é
        reaproveitada. Gateway sem resposta conclusiva (resultado da cobrança desconhecido ou tentativa anterior que não deu
        para conferir) → `503` `gateway-unavailable`; a tentativa fica `pending` e é conferida antes de qualquer nova cobrança.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebtPaymentRequest' }
      responses:
        '201':
          description: Pagamento da quitação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── webhooks ─────────────────────────────
  /webhooks/mercadopago:
    post:
      tags: [webhooks]
      operationId: receiveMercadoPagoWebhook
      summary: Webhook do Mercado Pago
      description: |
        Público. Valida `x-signature` (HMAC-SHA256 com `MERCADOPAGO_WEBHOOK_SECRET` sobre
        `id:<data.id>;request-id:<x-request-id>;ts:<ts>;`); assinatura inválida → `401` e nada é
        enfileirado. Evento válido é enfileirado e processado de forma idempotente (deduplicação por id do
        evento): o mesmo evento duas vezes gera um efeito só. Os campos do corpo seguem o formato do
        Mercado Pago (snake_case).
      security: []
      parameters:
        - name: x-signature
          in: header
          required: true
          description: '`ts=<epoch>,v1=<hmac hex>`.'
          schema: { type: string }
        - name: x-request-id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MercadoPagoWebhookEvent' }
      responses:
        '200':
          description: Evento recebido (ou já processado antes).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

