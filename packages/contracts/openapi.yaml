  # ───────────────────────────── entregas no galpão ─────────────────────────────
  /handovers:
    post:
      tags: [handovers]
      operationId: createHandover
      summary: Registrar entrega (saída ou chegada no galpão)
      description: |
        - `pickup`: o operador lê o `pickupCode` da reserva (precisa estar `active`, no galpão, com a moto `reserved`),
          envia checklist de saída, fotos (`POST /handovers/uploads`) e bateria. Cria a entrega `pending_customer`, a
          reserva passa a `handover` e o cliente recebe o evento `handover.pending`. Código adulterado ou vencido → `404`.
        - `return_depot`: chegada do aluguel `rentalId` no galpão. A entrega já nasce `accepted`, o aluguel é encerrado
          pelo fechamento normal e a moto volta a `free` com o `depotId` do galpão, ou vai para `maintenance` se algum
          item do checklist vier com `ok: false`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverCreate' }
            example:
              type: pickup
              depotId: 9b2d7c1e-4a3f-4e8b-8c55-1d2e3f4a5b6c
              pickupCode: v1.6c1f0a52-8f3e-4b8e-9d55-0d6a7f1e2c11.1792663200.Zm9vYmFy
              checklist:
                - { code: freios, ok: true }
                - { code: pneus, ok: true }
                - { code: carenagem, ok: true, note: 'Risco leve no lado direito, já registrado.' }
              photoKeys: [handovers/2c4e9a10.jpg, handovers/7d1b3c22.jpg]
              batteryPct: 98
              batterySerial: BT-190577
      responses:
        '201':
          description: Entrega registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [handovers]
      operationId: listHandovers
      summary: Entregas (operação, painel e disputas)
      description: Mais recentes primeiro. `suporte` usa `status=disputed` para a fila de disputas.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo, suporte]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/HandoverStatus' }
        - name: depotId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/HandoverType' }
      responses:
        '200':
          description: Página de entregas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /handovers/uploads:
    post:
      tags: [handovers]
      operationId: createHandoverPhotoUpload
      summary: URL de upload da foto da entrega
      description: Upload direto ao bucket (`handovers/<uuid>.<ext>`); depois envie as chaves em `photoKeys` de `POST /handovers`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: URL pré-assinada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /handovers/{id}:
    get:
      tags: [handovers]
      operationId: getHandover
      summary: Entrega ("Confira sua moto")
      description: |
        Cliente: só a entrega da própria reserva ou aluguel (senão `404`). Traz checklist, bateria e as fotos em
        `photoUrls` (links assinados, 24 h). O operador acompanha o status e `lastError` (ex.: pagamento não aprovado).
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, campo, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Entrega.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /handovers/{id}/accept:
    post:
      tags: [handovers]
      operationId: acceptHandover
      summary: Aceitar a moto e destravar
      description: |
        Só o cliente dono (outro cliente → `404`) e só com a entrega `pending_customer` (senão `422`
        `handover-not-pending`). Numa transação idempotente por entrega: cria o aluguel com o plano, o seguro e a
        caução da reserva, cobra o plano (assinatura em `weekly`/`monthly`), converte a reserva, pede o destravamento
        e a moto vai de `reserved` a `rented`. Aceites repetidos (mesma ou outra `Idempotency-Key`) devolvem o mesmo
        aluguel, com uma única cobrança. Exige consentimento de localização (`403` `location-consent-required`).

        Pagamento recusado → `422` `payment-declined`: nada muda, a entrega continua `pending_customer` com `lastError`
        e a moto não destrava. Gateway fora → `503` `gateway-unavailable`. Aluguel já ativo → `409`
        `rental-already-active`. `Idempotency-Key` ausente ou curta → `400`.

        Moto sem conexão ou sem confirmar o destravamento → `409` `vehicle-offline` ("Não conseguimos falar com a moto
        agora. Tente de novo em instantes ou fale com o operador."): nada é cobrado, nenhum aluguel é criado, a caução
        **continua retida** com a reserva, a entrega continua `pending_customer` (com `lastError: vehicle-offline`) e o
        cliente pode aceitar de novo.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Aluguel iniciado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /handovers/{id}/dispute:
    post:
      tags: [handovers]
      operationId: disputeHandover
      summary: Apontar problema na moto
      description: |
        Só o cliente dono (outro cliente → `404`) e só com a entrega `pending_customer` (`422` `handover-not-pending`).
        A entrega passa a `disputed`, abre um ticket de suporte e a moto continua separada (`reserved`) até o suporte
        resolver.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverDispute' }
      responses:
        '200':
          description: Problema registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /handovers/{id}/cancel:
    post:
      tags: [handovers]
      operationId: cancelHandover
      summary: Cancelar a entrega de saída (operação)
      description: |
        Para a saída `pickup` com status `pending_customer` ou `disputed` (outro status ou `return_depot` → `422`
        `handover-not-pending`; já aceita ou com aceite em andamento → `409`). Na mesma transação: a entrega vira
        `canceled` (AuditLog `handover.cancel`, evento `handover.updated`) e a reserva volta a `active` se ainda estiver no
        prazo (`expiresAt` no futuro; o `pickupCode` volta em `GET /reservations/current` e o operador pode registrar uma
        nova saída); fora do prazo, a reserva vira `expired`, a caução é liberada e a moto volta a `free` no galpão.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverCancel' }
      responses:
        '200':
          description: Entrega cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── zones ─────────────────────────────
  /zones:
    get:
      tags: [zones]
      operationId: listZones
      summary: Listar cercas
      description: Sem paginação (o número de zonas é pequeno). Filtra por `bbox` quando informado.
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte, campo]
      parameters:
        - name: bbox
          in: query
          description: 'Caixa `minLng,minLat,maxLng,maxLat` (WGS84).'
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
          example: '-46.72,-23.58,-46.64,-23.54'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ZoneType' }
        - name: includeInactive
          in: query
          description: Só staff.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Zonas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoZoneList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [zones]
      operationId: createZone
      summary: Criar cerca
      description: |
        Polígono GeoJSON válido (anel fechado, sem autointerseção) → senão `422` (`zone-invalid-geometry`).
        `reduced_speed` exige `speedLimitKmh`: ausente → `422` `zone-speed-limit-required`; entre 21 e 32 →
        `422` `zone-speed-limit-invalid` (máximo 20 em zonas de velocidade reduzida); acima de 32 → sempre `400`
        (validação do schema). Sincronizada com o motor de cercas. Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeoZoneInput' }
      responses:
        '201':
          description: Zona criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoZone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /zones/{id}:
    get:
      tags: [zones]
      operationId: getZone
      summary: Detalhe da cerca
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Zona.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoZone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [zones]
      operationId: updateZone
      summary: Substituir cerca
      description: Mesmas validações de `createZone`. Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeoZoneInput' }
      responses:
        '200':
          description: Zona atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoZone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [zones]
      operationId: deleteZone
      summary: Excluir cerca
      description: Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Zona excluída.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── reservations ─────────────────────────────
  /reservations:
    post:
      tags: [reservations]
      operationId: createReservation
      summary: Reservar moto
      description: |
        Uma reserva ativa por cliente (`409` `reservation-already-active`). Dura 15 minutos (TTL no Redis);
        ao expirar, a moto volta a `free`. Exige KYC aprovado (`403` `kyc-not-approved`) e cliente sem
        bloqueio. Cliente inadimplente ou com dívida em aberto (pagamento de aluguel/assinatura `failed` não quitado) →
        `409` `payment-pending` ("Pague o valor pendente para alugar de novo."); a dívida é paga por
        `POST /payments/{id}/retry`.

        Sem `depotId` (reserva de rua): moto com `depotId`, separada por reserva de galpão ou `awaiting_pickup` →
        `409` `vehicle-unavailable`. Moto do galpão só sai pela entrega.

        **Retirada em galpão** (com `depotId`): exige `Idempotency-Key`, `pickupMode`, `planCode`, `coverage` e
        `depositMethod`. Valida galpão ativo (`422` `depot-inactive`), horário dentro do funcionamento (`422`
        `pickup-outside-hours`) e de `maxScheduleDays` (`422` `pickup-too-far-ahead`), moto `free` no galpão (`409`
        `vehicle-unavailable`, inclusive quando outro cliente reservou no mesmo instante) e cliente sem aluguel nem
        reserva aberta (`409` `rental-already-active` / `reservation-open`). Bloqueia a caução (cartão: pré-autorização
        no `cardId` ou, sem ele, no cartão padrão; sem nenhum cartão ativo → `422` `card-required` ("Cadastre um cartão
        ou pague a caução com Pix."), `cardId` inexistente → `422` `card-not-found`, recusa do emissor → `422`
        `payment-declined`; Pix: `deposit.pix` com o QR) e separa a moto (`free` → `reserved`). O plano
        só é cobrado no aceite da entrega. A resposta traz `pickupCode` (QR de retirada). Cancelar
        (`DELETE /reservations/{id}`) é grátis e libera a caução; ao vencer `expiresAt`, um job expira a reserva.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
            examples:
              rua:
                summary: Reserva de rua (fluxo antigo)
                value: { vehicleId: 3f1c2a9e-0b4d-4c8e-9a55-7d6e5f4a3b2c }
              galpaoAgendado:
                summary: Retirada agendada no galpão
                value:
                  vehicleId: 3f1c2a9e-0b4d-4c8e-9a55-7d6e5f4a3b2c
                  depotId: 9b2d7c1e-4a3f-4e8b-8c55-1d2e3f4a5b6c
                  pickupMode: scheduled
                  pickupAt: '2026-10-23T13:00:00Z'
                  planCode: day
                  coverage: basic
                  depositMethod: pix
      responses:
        '201':
          description: Reserva criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /reservations/current:
    get:
      tags: [reservations]
      operationId: getCurrentReservation
      summary: Reserva ativa do cliente
      description: |
        Sempre `200`; `reservation` fica ausente quando não há reserva aberta. Reserva aberta = `active` ou `handover`
        (entrega de galpão aguardando o aceite; o app abre "Confira sua moto" com `handoverId`).
      security:
        - customerAuth: []
      responses:
        '200':
          description: Reserva atual (ou nenhuma).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentReservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reservations/{id}:
    delete:
      tags: [reservations]
      operationId: cancelReservation
      summary: Cancelar reserva
      description: |
        Grátis. A moto volta a `free` e, em reserva de galpão, a caução é liberada (pré-autorização cancelada ou Pix
        estornado). Reserva com status `handover` (entrega aberta) → `409` `reservation-in-handover`: o cliente usa
        `POST /handovers/{id}/dispute`, ou o operador cancela a entrega. Reserva já encerrada → `409`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Reserva cancelada; a moto volta a `free` e a caução é liberada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── rentals ─────────────────────────────
  /rentals:
    post:
      tags: [rentals]
      operationId: startRental
      summary: Iniciar aluguel
      description: |
        Exige KYC aprovado (`403` `kyc-not-approved`), cliente não inadimplente (`403`
        `customer-delinquent`), consentimento de localização (`403` `location-consent-required`, ver
        `PUT /lgpd/consents`), seguro (`coverage`; `basic` é o mínimo obrigatório) e caução.

        Moto do galpão: moto com `depotId`, ou separada por uma reserva de galpão (mesmo do próprio cliente), responde
        `409` `vehicle-unavailable` aqui; ela só sai do galpão pelo aceite da entrega (`POST /handovers/{id}/accept`).
        A moto precisa estar `free` ou reservada pelo próprio cliente (senão `409` `vehicle-unavailable`).
        Moto com bloqueio da equipe ou do sistema (cerca, limite segurado em 0, modo roubada) → `409`
        `vehicle-unavailable` ("A moto está bloqueada pela equipe. Escolha outra.") antes de reter a caução.

        Caução (`depositMethod`):
        - `card`: pré-autoriza 5000 no cartão (`cardId` ou o cartão padrão). Sucesso → `201` com
          `outcome: started`, aluguel `active` e desbloqueio pedido ao módulo IoT. Sem nenhum cartão ativo →
          `422` `card-required`.
        - `pix`: gera a cobrança Pix → `202` com `outcome: awaiting_deposit` e `deposit.pix`. A resposta cria
          (ou estende) uma reserva do cliente para essa moto válida até `pix.expiresAt`, com as mesmas regras
          das reservas (uma por cliente, KYC aprovado, sem bloqueio) e no máximo o prazo do Pix. Depois do
          pagamento (`GET /payments/deposits/{id}` com `held`), o app chama `POST /rentals` de novo, com
          **nova** `Idempotency-Key` e `depositId`, e recebe `201`. Caução paga cujo aluguel não chega a
          iniciar (reserva expirada, `409` na segunda chamada, cancelamento) é liberada/estornada
          automaticamente (`DepositStatus` → `released`).

        Idempotência: a mesma `Idempotency-Key` devolve a mesma resposta e não cria outro aluguel.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRentalRequest' }
      responses:
        '201':
          description: Aluguel iniciado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalStartResult' }
        '202':
          description: Aguardando pagamento da caução via Pix.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalStartResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [rentals]
      operationId: listRentals
      summary: Listar aluguéis
      description: Cliente vê só os próprios (filtros de staff são ignorados). Ordem decrescente por início.
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RentalStatus' }
        - name: customerId
          in: query
          description: Só staff.
          schema: { type: string, format: uuid }
        - name: vehicleId
          in: query
          description: Só staff.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Página de aluguéis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rentals/current:
    get:
      tags: [rentals]
      operationId: getCurrentRental
      summary: Aluguel em andamento do cliente
      description: Sempre `200`; `rental` fica ausente quando não há aluguel `active`, `paused` ou `ending`. Usado ao reabrir o app.
      security:
        - customerAuth: []
      responses:
        '200':
          description: Aluguel atual (ou nenhum).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentRental' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rentals/{id}:
    get:
      tags: [rentals]
      operationId: getRental
      summary: Detalhe do aluguel
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Aluguel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rentals/{id}/events:
    get:
      tags: [rentals]
      operationId: listRentalEvents
      summary: Linha do tempo do aluguel
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Eventos em ordem cronológica.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rentals/{id}/pause:
    post:
      tags: [rentals]
      operationId: pauseRental
      summary: Pausar aluguel
      description: Trava a moto (bloqueio seguro) e passa a cobrar a tarifa de pausa. Só de `active` (senão `409` `rental-not-active`).
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Aluguel pausado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rentals/{id}/resume:
    post:
      tags: [rentals]
      operationId: resumeRental
      summary: Retomar aluguel
      description: |
        Destrava a moto. Só de `paused` (senão `409` `rental-not-active`). Se a moto foi travada pela equipe ou pelo
        sistema (cerca, limite segurado em 0 depois de não parar, modo roubada), `409` `vehicle-locked-by-staff`
        ("A moto foi bloqueada pela equipe. Fale com o suporte.") e o aluguel continua `paused`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Aluguel retomado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rentals/{id}/swap:
    post:
      tags: [rentals]
      operationId: swapRentalVehicle
      summary: Trocar de moto
      description: |
        Troca a moto do aluguel em andamento (ex.: defeito). Trava a moto atual, que vai para
        `maintenance`, e destrava a nova (precisa estar `free`, fora do galpão, online, a até 200 m, sem aluguel nem
        reserva e não ser a moto fixa do plano de outro cliente; senão `409` `vehicle-unavailable` ou `vehicle-offline`).
        O preço continua o do início do aluguel, então a nova moto precisa ter preço por minuto (modelo do catálogo)
        igual ou menor (`409`). Nova moto com bloqueio da equipe ou do sistema → `409` `vehicle-unavailable` ("A moto
        escolhida está bloqueada pela equipe."), sem trocar nada. Moto ATUAL com bloqueio da equipe ou do sistema
        (cerca, hold, modo roubada) → `409` `vehicle-locked-by-staff` ("A moto foi bloqueada pela equipe. Fale com o
        suporte."), mesmo com incidente, sem trocar nada. Se o aluguel mudar de status (pausa/retomada) durante a troca
        → `409` `rental-not-active`. Com troca de bateria na estação em andamento (`currentStationSwap`) → `409`
        `swap-open`. O aluguel continua o mesmo, com evento `vehicle_swapped`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwapVehicleRequest' }
      responses:
        '200':
          description: Moto trocada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rentals/{id}/return-photo:
    post:
      tags: [rentals]
      operationId: createReturnPhotoUpload
      summary: URL pré-assinada para a foto de devolução
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: URL criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rentals/{id}/end:
    post:
      tags: [rentals]
      operationId: endRental
      summary: Encerrar aluguel
      description: |
        Só dentro de uma zona `return` (`422` `rental-outside-return-zone`) e com a foto enviada
        (`422` `return-photo-missing`). Com troca de bateria na estação em andamento (`currentStationSwap` em
        `GET /rentals/current`) → `409` `swap-open` (termine ou cancele a troca antes; o encerramento forçado pelo
        staff continua permitido). Pede o travamento ao rastreador:
        - travada confirmada → `200`, status `ended`, valor final calculado (plano + seguro − cupom) e
          liquidado uma única vez;
        - sem confirmação ainda → `202`, status `ending`; o servidor tenta de novo e o cliente acompanha por
          `rental.updated` ou `GET /rentals/{id}`.
        Moto com bloqueio da equipe ou do sistema no encerramento (normal ou forçado) volta como `maintenance`, não
        `free`, com alerta `command_failed` para a operação liberar.

        Liquidação idempotente por `rentalId`: no máximo uma liquidação por aluguel, não importa quantas
        vezes a chamada seja repetida (com ou sem `Idempotency-Key`). A `Idempotency-Key` opcional faz a
        repetição devolver a mesma resposta.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndRentalRequest' }
      responses:
        '200':
          description: Aluguel encerrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '202':
          description: Encerramento em andamento (aguardando "parada e travada").
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rentals/{id}/force-end:
    post:
      tags: [rentals]
      operationId: forceEndRental
      summary: Encerramento forçado (staff)
      description: |
        `reason` obrigatório (`400` sem ele). Dispensa a foto. Status final `force_ended`; trava a moto com
        bloqueio seguro. Fora de uma zona `return`, só `admin` pode forçar (`403`
        `force-end-outside-zone-requires-admin`) e soma a taxa `force_end_outside_return_zone` (1500).
        Grava AuditLog. Liquidação idempotente por `rentalId` (no máximo uma por aluguel, mesmo com
        repetições); a `Idempotency-Key` opcional faz a repetição devolver a mesma resposta.
      security:
        - staffAuth: []
      x-required-groups: [admin, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForceEndRentalRequest' }
      responses:
        '200':
          description: Aluguel encerrado à força.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rentals/{id}/track:
    get:
      tags: [rentals]
      operationId: getRentalTrack
      summary: Trajeto do aluguel
      description: Pontos gravados durante o aluguel (expiram após 90 dias). Usado no recibo e no replay.
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Trajeto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rentals/{id}/receipt:
    get:
      tags: [rentals]
      operationId: getRentalReceipt
      summary: Recibo do aluguel
      description: |
        Disponível após `ended`/`force_ended` (senão `409`). Inclui o trajeto, a situação do pagamento (`paymentStatus`)
        e, só com o pagamento recebido (`paid`), o link do PDF. Ordem de liquidação no fechamento: carteira (linha
        `wallet` do `breakdown`) → caução (a caução Pix abate o valor; só o saldo é devolvido, `depositUsedCents` /
        `depositReleasedCents`) → cartão salvo → o restante vira dívida (`pending`, `amountDueCents`), paga pelo cliente
        em `POST /payments/{paymentId}/retry` (Pix ou cartão).
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, financeiro, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Recibo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rentals/{id}/rating:
    post:
      tags: [rentals]
      operationId: rateRental
      summary: Avaliar aluguel
      description: Uma avaliação por aluguel encerrado (repetir substitui).
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RatingRequest' }
      responses:
        '200':
          description: Avaliação registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rentals/{id}/location-share:
    post:
      tags: [rentals]
      operationId: shareRentalLocation
      summary: Compartilhar localização (SOS)
      description: Gera um link temporário com a posição ao vivo da moto do aluguel, para o cliente enviar a um contato. Expira no fim do aluguel ou em `durationMinutes`, o que vier primeiro.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationShareRequest' }
      responses:
        '201':
          description: Link criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationShare' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /public/location-shares/{token}:
    get:
      tags: [public]
      operationId: getSharedLocation
      summary: Localização compartilhada (link público do SOS)
      description: |
        Sem autenticação: quem tem o link vê **só** a última posição da moto e o horário dela, enquanto o compartilhamento
        estiver dentro da validade e o aluguel continuar aberto. Nenhum dado pessoal (nome, telefone, moto, trajeto).
        Token desconhecido, expirado ou aluguel encerrado → 404 (mesma resposta, sem revelar qual). Rate limit por IP.
        `Cache-Control: no-store`, `Referrer-Policy: no-referrer`, `X-Robots-Tag: noindex`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Última posição conhecida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedLocation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /share/{token}:
    get:
      tags: [public]
      operationId: getSharedLocationPage
      summary: Página da localização compartilhada
      description: |
        Página HTML mínima (pt-BR) aberta pelo link de `POST /rentals/{id}/location-share` (`PUBLIC_SHARE_BASE_URL/{token}`):
        mostra a última posição e o horário (fuso America/Sao_Paulo), com link para abrir no mapa, e se atualiza sozinha a cada
        15 s lendo `GET /public/location-shares/{token}`. Sem autenticação, sem cookies e sem scripts de terceiros.
      security: []
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Página HTML (o estado "link expirado" também é uma página 200; os dados vêm da rota JSON).
          content:
            text/html:
              schema: { type: string }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /rentals/{id}/wellbeing:
    post:
      tags: [rentals]
      operationId: respondWellbeingCheck
      summary: Responder "você está bem?"
      description: 'Resposta ao evento `device.event` de queda. `ok: false` (ou nenhuma resposta em 60 s) gera alerta `critical` do tipo `customer_not_ok`.'
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WellbeingResponse' }
      responses:
        '204':
          description: Resposta registrada.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

