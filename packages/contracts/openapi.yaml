  /payments/{id}/refund:
    post:
      tags: [payments]
      operationId: refundPayment
      summary: Estornar pagamento
      description: Total (sem `amountCents`) ou parcial. Só de `paid`, `captured` ou `partially_refunded`, até o valor ainda não estornado (`422`). Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, financeiro]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
