        amountCents: { type: integer, description: Positivo = crédito; negativo = débito. }
        minutes: { type: integer, description: Variação de minutos (pacotes). }
        balanceAfterCents: { type: integer }
        description: { type: string }
        rentalId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        createdById: { type: string, format: uuid, description: staff que fez o ajuste. }
