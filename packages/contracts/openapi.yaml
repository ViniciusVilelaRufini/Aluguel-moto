    DisputePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Dispute' }
        nextCursor: { type: string }
    Claim:
      type: object
      required: [id, customerId, rentalId, type, status, description, occurredAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        insurancePolicyId: { type: string, format: uuid }
        providerClaimId: { type: string }
        type: { $ref: '#/components/schemas/ClaimType' }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        photoObjectKeys:
          type: array
          items: { type: string }
        statusNote: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClaimCreate:
      type: object
      required: [rentalId, type, description, occurredAt]
      properties:
        rentalId: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ClaimType' }
        description: { type: string, minLength: 10, maxLength: 4000 }
        occurredAt: { type: string, format: date-time }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        photoObjectKeys:
          type: array
          maxItems: 10
          items: { type: string }
    ClaimUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ClaimStatus' }
        statusNote: { type: string, maxLength: 2000 }
    ClaimPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Claim' }
        nextCursor: { type: string }
    SupportConversation:
      type: object
      required: [id, customerId, subject, status, createdAt, lastMessageAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string, description: staff. }
        rentalId: { type: string, format: uuid }
        subject: { type: string }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        unreadCount: { type: integer, minimum: 0, description: Mensagens não lidas por quem consulta. }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
    SupportConversationCreate:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 3, maxLength: 120 }
        message: { type: string, minLength: 1, maxLength: 4000 }
        rentalId: { type: string, format: uuid }
    SupportConversationUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ConversationStatus' }
    SupportConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportConversation' }
        nextCursor: { type: string }
    SupportMessage:
      type: object
      required: [id, conversationId, authorType, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        authorType: { $ref: '#/components/schemas/MessageAuthorType' }
        authorId: { type: string, format: uuid }
        authorName:
          type: string
          description: |
            Mensagem da equipe: primeiro nome cadastrado do atendente ou, sem nome cadastrado, "Equipe Volti" (nunca
            derivado do e-mail).
        body: { type: string }
        attachmentObjectKeys:
          type: array
          items: { type: string }
        attachmentUrls:
          type: array
          items: { type: string, format: uri }
          description: |
            Só nas respostas para a equipe: URLs pré-assinadas (GET, 15 minutos) dos anexos, na mesma ordem de
            `attachmentObjectKeys`. Só anexos enviados pelo próprio autor (`support/<authorId>/…`) ganham URL.
        status: { $ref: '#/components/schemas/SupportMessageStatus' }
        deliveredAt: { type: string, format: date-time, description: O outro lado buscou a mensagem. }
        readAt: { type: string, format: date-time, description: O outro lado marcou como lida. }
        createdAt: { type: string, format: date-time }
    SupportMessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        attachmentObjectKeys:
          type: array
          maxItems: 4
          items: { type: string }
    SupportMessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportMessage' }
        nextCursor: { type: string }

    # ───────────── field-tasks ─────────────
    FieldTask:
      type: object
      required: [id, type, status, priority, vehicleId, vehicleCode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/FieldTaskType' }
        status: { $ref: '#/components/schemas/FieldTaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        vehicleId: { type: string, format: uuid }
        vehicleCode: { type: string }
        vehicleLat: { type: number, format: double, description: Última posição conhecida da moto. }
        vehicleLng: { type: number, format: double }
        vehicleBatteryPct: { type: integer, minimum: 0, maximum: 100 }
        vehicleStatus: { $ref: '#/components/schemas/VehicleStatus' }
        vehicleAddress: { type: string, description: Endereço aproximado da moto., examples: ['R. Fradique Coutinho, 410 · Pinheiros, São Paulo'] }
        vehicleBatterySerial: { type: string, description: Bateria instalada (retirada numa troca)., examples: [BT-190577] }
        vehicleBatteryCycleCount: { type: integer, minimum: 0 }
        targetAddress: { type: string, description: Endereço aproximado do destino. }
        targetLat: { type: number, format: double, description: Destino (reposicionar). }
        targetLng: { type: number, format: double }
        assigneeId: { type: string, format: uuid }
        assigneeName: { type: string }
        notes: { type: string }
        dueAt: { type: string, format: date-time }
        maintenanceTaskId: { type: string, format: uuid }
        createdById: { type: string, format: uuid }
        completionNotes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    FieldTaskCreate:
      type: object
      required: [type, vehicleId, priority]
      properties:
        type: { $ref: '#/components/schemas/FieldTaskType' }
        vehicleId: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assigneeId: { type: string, format: uuid }
        notes: { type: string, maxLength: 2000 }
        dueAt: { type: string, format: date-time }
        targetLat: { type: number, format: double, minimum: -90, maximum: 90 }
        targetLng: { type: number, format: double, minimum: -180, maximum: 180 }
        maintenanceTaskId: { type: string, format: uuid }
    FieldTaskUpdate:
      type: object
      properties:
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assigneeId: { type: string, format: uuid }
        notes: { type: string, maxLength: 2000 }
        dueAt: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/FieldTaskStatus'
          description: Só `canceled` é aceito aqui.
    FieldTaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FieldTask' }
        nextCursor: { type: string }
    FieldTaskCompleteRequest:
      type: object
      properties:
        notes: { type: string, maxLength: 2000 }
        vehicleStatus: { $ref: '#/components/schemas/ServiceVehicleStatus' }
        depotId: { type: string, format: uuid, description: 'Tarefa `collect`: galpão onde a moto chegou; a moto volta a `free` com esse `depotId`.' }
        completedAt: { type: string, format: date-time, description: Instante real (modo offline). }
    ChecklistItem:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        notes: { type: string, maxLength: 500 }
    SpeedLimiterCheck:
      type: object
      required: [ok, configuredMaxKmh]
      properties:
        ok: { type: boolean }
        configuredMaxKmh:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Observação: velocidade máxima lida no controlador durante a inspeção (0 a 100). Não configura
            nada (limites configuráveis continuam 0..32). Acima de 32 a moto está fora da lei: `ok: true` →
            `422` `speed-limiter-noncompliant`; a API abre manutenção corretiva e alerta e põe a moto em
            `maintenance`.
        notes: { type: string, maxLength: 500 }
    InspectionRequest:
      type: object
      required: [brakes, tires, lights, bell, speedLimiter, photoObjectKeys, recordedAt]
      properties:
        brakes: { $ref: '#/components/schemas/ChecklistItem' }
        tires: { $ref: '#/components/schemas/ChecklistItem' }
        lights: { $ref: '#/components/schemas/ChecklistItem' }
        bell: { $ref: '#/components/schemas/ChecklistItem' }
        speedLimiter: { $ref: '#/components/schemas/SpeedLimiterCheck' }
        photoObjectKeys:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string }
        notes: { type: string, maxLength: 2000 }
        recordedAt: { type: string, format: date-time }
    Inspection:
      type: object
      required: [id, fieldTaskId, vehicleId, inspectorId, brakes, tires, lights, bell, speedLimiter, photoObjectKeys, passed, recordedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        fieldTaskId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        inspectorId: { type: string, format: uuid }
        brakes: { $ref: '#/components/schemas/ChecklistItem' }
        tires: { $ref: '#/components/schemas/ChecklistItem' }
        lights: { $ref: '#/components/schemas/ChecklistItem' }
        bell: { $ref: '#/components/schemas/ChecklistItem' }
        speedLimiter: { $ref: '#/components/schemas/SpeedLimiterCheck' }
        photoObjectKeys:
          type: array
          items: { type: string }
        notes: { type: string }
        passed: { type: boolean, description: Todos os itens ok. }
        maintenanceTaskId: { type: string, format: uuid, description: 'Manutenção aberta automaticamente (limitador acima de 32 km/h).' }
        alertId: { type: string, format: uuid, description: 'Alerta `speed_limiter_noncompliant` aberto automaticamente.' }
        recordedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    BatterySwapRequest:
      type: object
      required: [removedBatterySerial, installedBatterySerial, recordedAt]
      properties:
        removedBatterySerial: { type: string, minLength: 3, maxLength: 64 }
        installedBatterySerial: { type: string, minLength: 3, maxLength: 64 }
        installedBatteryPct: { type: integer, minimum: 0, maximum: 100 }
        recordedAt: { type: string, format: date-time }
    BatterySwap:
      type: object
      required: [id, fieldTaskId, vehicleId, operatorId, removedBatterySerial, installedBatterySerial, recordedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        fieldTaskId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid }
        removedBatterySerial: { type: string }
        installedBatterySerial: { type: string }
        installedBatteryPct: { type: integer, minimum: 0, maximum: 100 }
        removedBatteryPct: { type: integer, minimum: 0, maximum: 100, description: Carga da bateria retirada (última leitura da moto). }
        removedBatteryCycleCount: { type: integer, minimum: 0 }
        installedBatteryCycleCount: { type: integer, minimum: 0 }
        recordedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    # ───────────── maintenance ─────────────
    MaintenanceTask:
      type: object
      required: [id, vehicleId, kind, title, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        vehicleCode: { type: string }
        kind: { $ref: '#/components/schemas/MaintenanceKind' }
        title: { type: string, examples: [Revisão de freios] }
        description: { type: string }
        status: { $ref: '#/components/schemas/MaintenanceStatus' }
        scheduledFor: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        notes: { type: string }
        createdById: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/MaintenanceSource' }
        customerId: { type: string, format: uuid, description: Cliente que agendou (`source = customer`). }
        customerName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MaintenanceTaskCreate:
      type: object
      required: [vehicleId, kind, title]
      properties:
        vehicleId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MaintenanceKind' }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        scheduledFor: { type: string, format: date-time }
        createFieldTask: { type: boolean, default: false, description: Cria também uma tarefa de campo `maintenance`. }
    MaintenanceTaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        status: { $ref: '#/components/schemas/MaintenanceStatus' }
        scheduledFor: { type: string, format: date-time }
        notes: { type: string, maxLength: 2000 }
    MaintenanceTaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceTask' }
        nextCursor: { type: string }

    # ───────────── reports ─────────────
    VehicleStatusCounts:
      type: object
      required: [free, rented, reserved, paused, blocked, maintenance, offline, awaiting_pickup]
      properties:
        free: { type: integer, minimum: 0 }
        rented: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        paused: { type: integer, minimum: 0 }
        blocked: { type: integer, minimum: 0 }
        maintenance: { type: integer, minimum: 0 }
        offline: { type: integer, minimum: 0 }
        awaiting_pickup: { type: integer, minimum: 0, description: 'Retirada em galpão: devolvidas em ponto verde, esperando recolhimento.' }
    DashboardSummary:
      type: object
      required: [generatedAt, occupancyPct, activeRentals, revenueTodayCents, openAlerts, vehiclesByStatus]
      properties:
        generatedAt: { type: string, format: date-time }
        occupancyPct: { type: number, format: double, minimum: 0, maximum: 100 }
        activeRentals: { type: integer, minimum: 0 }
        revenueTodayCents: { type: integer, minimum: 0, description: 'Mesma definição de `FinanceReport.totalRevenueCents`, desde 00:00 de hoje (America/Sao_Paulo).' }
        openAlerts: { type: integer, minimum: 0 }
        vehiclesByStatus: { $ref: '#/components/schemas/VehicleStatusCounts' }
    HeatmapPoint:
      type: object
      required: [lat, lng, weight]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        weight: { type: integer, minimum: 1, description: Quantidade de inícios de aluguel na célula. }
    DemandHeatmap:
      type: object
      required: [from, to, points]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/HeatmapPoint' }
    RevenueRow:
      type: object
      required: [periodStart, rentals, grossCents, discountCents, insuranceCents, feesCents, netCents]
      properties:
        periodStart: { type: string, format: date-time }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        rentals: { type: integer, minimum: 0 }
        grossCents: { type: integer }
        discountCents: { type: integer }
        insuranceCents: { type: integer }
        feesCents: { type: integer }
        walletCents: { type: integer, description: 'Créditos da carteira usados nos aluguéis. `netCents` = `grossCents` − `discountCents` + `insuranceCents` + `feesCents` − `walletCents`.' }
        refundsCents: { type: integer }
        netCents: { type: integer }
    RevenueReport:
      type: object
      required: [from, to, groupBy, rows, totalNetCents]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        groupBy: { $ref: '#/components/schemas/ReportGroupBy' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RevenueRow' }
        totalNetCents: { type: integer }
    OccupancyRow:
      type: object
      required: [periodStart, vehiclesTotal, vehiclesRented, occupancyPct]
      properties:
        periodStart: { type: string, format: date-time }
        vehiclesTotal: { type: integer, minimum: 0 }
        vehiclesRented: { type: integer, minimum: 0, description: Média de motos em aluguel no período. }
        occupancyPct: { type: number, format: double, minimum: 0, maximum: 100 }
    OccupancyReport:
      type: object
      required: [from, to, groupBy, rows]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        groupBy: { $ref: '#/components/schemas/ReportGroupBy' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/OccupancyRow' }
    VehicleRevenueRow:
      type: object
      required: [vehicleId, vehicleCode, date, rentals, revenueCents]
      properties:
        vehicleId: { type: string, format: uuid }
        vehicleCode: { type: string }
        date: { type: string, format: date, description: Dia no fuso America/Sao_Paulo. }
        rentals: { type: integer, minimum: 0 }
        rentedSeconds: { type: integer, minimum: 0 }
        revenueCents: { type: integer }
    VehicleRevenueReport:
      type: object
      required: [from, to, rows]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: '#/components/schemas/VehicleRevenueRow' }
    PlanRevenue:
      type: object
      required: [planCode, rentals, revenueCents]
      properties:
        planCode: { $ref: '#/components/schemas/PlanCode' }
        rentals: { type: integer, minimum: 0 }
        revenueCents: { type: integer }
    FinanceReport:
      type: object
      required: [from, to, revenueByPlan, totalRevenueCents, depositsHeldCount, depositsHeldCents, delinquentCustomers, delinquentAmountCents, refundsCents, insurancePremiumsCents, insurancePayoutsCents]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        revenueByPlan:
          type: array
          description: Receita de aluguéis encerrados no período, por plano (custo total do aluguel).
          items: { $ref: '#/components/schemas/PlanRevenue' }
        rentalRevenueCents: { type: integer, minimum: 0, description: Soma de `revenueByPlan`. }
        subscriptionRevenueCents:
          type: integer
          minimum: 0
          description: Cobranças de assinatura (semanal/mensal, inclusive renovações) pagas, criadas no período.
        totalRevenueCents:
          type: integer
          description: |
            Receita = aluguéis encerrados (`rentalRevenueCents`) + assinaturas pagas (`subscriptionRevenueCents`).
            Não entram: caução (garantia), recargas e pacotes de minutos da carteira (`walletTopUpsCents`, crédito
            pré-pago que vira receita quando é usado num aluguel) e estornos (`refundsCents`, informados à parte).
        depositsHeldCount: { type: integer, minimum: 0, description: Cauções retidas agora. }
        depositsHeldCents: { type: integer, minimum: 0 }
        delinquentCustomers: { type: integer, minimum: 0 }
        delinquentAmountCents: { type: integer, minimum: 0 }
        refundsCents: { type: integer, minimum: 0 }
        walletTopUpsCents: { type: integer, minimum: 0 }
        insurancePremiumsCents: { type: integer, minimum: 0 }
        insurancePayoutsCents: { type: integer, minimum: 0, description: Repasses à seguradora. }

    # ───────────── customers ─────────────
    CustomerStats:
      type: object
      required: [rentalsCount, totalSpentCents, openDisputes]
      properties:
        rentalsCount: { type: integer, minimum: 0 }
        totalSpentCents: { type: integer, minimum: 0 }
        openDisputes: { type: integer, minimum: 0 }
        lastRentalAt: { type: string, format: date-time }
    Customer:
      type: object
      required: [id, email, kycStatus, status, delinquent, restricted, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        cpf:
          type: string
          description: Completo para o próprio cliente e para `admin`; mascarado (`***.456.789-**`) para os demais grupos.
        birthDate: { type: string, format: date }
        kycStatus: { $ref: '#/components/schemas/KycStatus' }
        status: { $ref: '#/components/schemas/CustomerStatus' }
        delinquent: { type: boolean, description: Inadimplente (sem novos aluguéis). }
        restricted: { type: boolean, description: CPF na lista de restrição. }
        blockedReason: { type: string, description: staff. }
        blockedAt: { type: string, format: date-time }
        locationConsent: { type: boolean }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        pixRefundKeyType: { $ref: '#/components/schemas/PixKeyType' }
        pixRefundKey:
          type: string
          description: Chave Pix para estornos. Completa para o próprio cliente, `admin` e `financeiro`; mascarada para os demais.
        activePlanCode: { $ref: '#/components/schemas/SubscriptionPlanCode' }
        activeSubscriptionId: { type: string, format: uuid, description: Assinatura semanal/mensal ativa ou pausada. }
        stats: { $ref: '#/components/schemas/CustomerStats' }
        walletBalanceCents: { type: integer, description: 'Só `admin` e `financeiro`, no detalhe (`GET /customers/{id}`): saldo da carteira (soma do ledger; pode ser negativo depois de um ajuste antigo).' }
        debtCents: { type: integer, minimum: 0, description: 'Só `admin` e `financeiro`, no detalhe: soma do saldo devedor (`outstandingCents`) das dívidas em aberto.' }
        createdAt: { type: string, format: date-time }
    CustomerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        nextCursor: { type: string }
    CustomerBlockRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        addToRestrictionList: { type: boolean, default: false }
    RestrictionEntry:
      type: object
      required: [id, cpf, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        cpf: { type: string, description: Mascarado para quem não é `admin`. }
        reason: { type: string }
        createdById: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    RestrictionEntryCreate:
      type: object
      required: [cpf, reason]
      properties:
        cpf: { type: string, pattern: '^\d{11}$' }
        reason: { type: string, minLength: 3, maxLength: 500 }
    RestrictionEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RestrictionEntry' }
        nextCursor: { type: string }

    # ───────────── staff ─────────────
    StaffUser:
      type: object
      required: [id, email, name, groups, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        groups:
          type: array
          items: { $ref: '#/components/schemas/StaffGroup' }
        active: { type: boolean }
        mfaEnabled: { type: boolean }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    StaffUserCreate:
      type: object
      required: [email, name, groups]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 2, maxLength: 120 }
        groups:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StaffGroup' }
    StaffUserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        groups:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StaffGroup' }
        active: { type: boolean }
    StaffUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StaffUser' }
        nextCursor: { type: string }

    # ───────────── audit ─────────────
    AuditLog:
      type: object
      required: [id, actorType, action, entityType, entityId, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorId: { type: string, format: uuid }
        actorName: { type: string }
        action:
          type: string
          description: 'Ex.: `vehicle.command.lock`, `vehicle.service_unlock`, `rental.force_end`, `zone.update`, `customer.block`, `payment.refund`, `pricing.plan.update`.'
        entityType: { type: string, examples: [vehicle] }
        entityId: { type: string }
        reason: { type: string }
        metadata:
          type: object
          description: Antes/depois ou parâmetros do comando (sem dados pessoais).
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    AuditLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        nextCursor: { type: string }

    # ───────────── lgpd ─────────────
    Consents:
      type: object
      required: [termsAccepted, locationTracking, marketing]
      properties:
        termsVersion: { type: string, examples: ['2026-10-01'] }
        termsAccepted: { type: boolean }
        termsAcceptedAt: { type: string, format: date-time }
        locationTracking: { type: boolean, description: Rastrear a localização durante o aluguel. }
        locationTrackingUpdatedAt: { type: string, format: date-time }
        marketing: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ConsentsUpdate:
      type: object
      required: [termsVersion, termsAccepted, locationTracking, marketing]
      properties:
        termsVersion: { type: string, maxLength: 32 }
        termsAccepted: { type: boolean }
        locationTracking: { type: boolean }
        marketing: { type: boolean }
    LgpdExport:
      type: object
      required: [generatedAt, customer, consents, rentals, payments, tracks, walletEntries, incidents, disputes, claims]
      properties:
        generatedAt: { type: string, format: date-time }
        customer: { $ref: '#/components/schemas/Customer' }
        consents: { $ref: '#/components/schemas/Consents' }
        rentals:
          type: array
          items: { $ref: '#/components/schemas/Rental' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        tracks:
          type: array
          items: { $ref: '#/components/schemas/Track' }
        walletEntries:
          type: array
          items: { $ref: '#/components/schemas/WalletEntry' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        disputes:
          type: array
          items: { $ref: '#/components/schemas/Dispute' }
        claims:
          type: array
          items: { $ref: '#/components/schemas/Claim' }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/Subscription' }
        coupons:
          type: array
          items: { $ref: '#/components/schemas/CustomerCoupon' }
        referrals:
          type: array
          description: Indicações feitas pelo titular (só o primeiro nome do amigo).
          items: { $ref: '#/components/schemas/ReferralReward' }
        referralCode: { type: string }
        maintenanceRequests:
          type: array
          items: { $ref: '#/components/schemas/CustomerMaintenanceRequest' }
        depotReservations:
          type: array
          description: Reservas de retirada no galpão (sem `pickupCode`).
          items: { $ref: '#/components/schemas/Reservation' }
        handovers:
          type: array
          description: Entregas do titular (fotos só como chaves, sem links).
          items: { $ref: '#/components/schemas/Handover' }
        stationSwaps:
          type: array
          description: Trocas de bateria na estação feitas pelo titular (sem posição).
          items: { $ref: '#/components/schemas/StationSwap' }
        supportConversations:
          type: array
          description: Conversas do chat de suporte com as mensagens (anexos só como chaves; atendente só pelo primeiro nome).
          items: { $ref: '#/components/schemas/LgpdSupportConversation' }
    LgpdSupportConversation:
      allOf:
        - $ref: '#/components/schemas/SupportConversation'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/SupportMessage' }
    AccountDeletion:
      type: object
      required: [status, requestedAt]
      properties:
        status: { $ref: '#/components/schemas/AccountDeletionStatus' }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    # ───────────── contrato v2 (docs/decisoes.md, 2026-10-22) ─────────────
    PixKeyType:
      type: string
      enum: [cpf, email, phone, random]
      description: '`cpf` 11 dígitos (o CPF do próprio cliente); `email`; `phone` E.164 brasileiro (`+55…`); `random` chave aleatória (UUID).'
    CustomerCouponStatus:
      type: string
      enum: [available, used, expired]
    CustomerCouponSource:
      type: string
      enum: [manual, referral]
    ReferralRewardStatus:
      type: string
      enum: [pending, granted, canceled]
      description: '`pending` até o indicado terminar a primeira corrida; `granted` com o bônus lançado na carteira.'
    SupportMessageStatus:
      type: string
      enum: [sent, delivered, read]
    VehicleServiceStatus:
      type: string
      enum: [ok, due_soon, overdue]
      description: Situação da revisão preventiva (Em dia / Próxima / Vencida).
    BatteryStatus:
      type: string
      enum: [in_vehicle, in_van, charging, in_station, retired, charged, defective]
      description: |
        `in_vehicle` instalada numa moto; `in_van` na van de um operador; `charging` carregando (no galpão `depotId` ou na
        estação `stationId`); `charged` carregada e pronta no galpão; `in_station` na estação de troca; `defective` com
        defeito, fora de uso; `retired` baixada.
    MaintenanceSource:
      type: string
      enum: [staff, customer, system]
      description: Quem abriu a manutenção (painel, cliente do plano semanal/mensal ou regra automática).

    # catálogo
    VehicleModel:
      type: object
      required: [id, name, slug, categoryLabel, pricePerMinuteCents, serviceIntervalKm, serviceIntervalHours, active, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Volti Flash] }
        slug: { type: string, examples: [flash] }
        categoryLabel: { type: string, description: Rótulo da categoria (pt-BR)., examples: [Urbana] }
        description: { type: string }
        photoUrl: { type: string, format: uri, description: Link assinado da foto (24 h). Ausente sem foto. }
        photoObjectKey: { type: string, description: staff. Chave do objeto no bucket de catálogo. }
        pricePerMinuteCents: { type: integer, minimum: 0, examples: [79], description: Preço por minuto do plano `minute` para este modelo. }
        unlockFeeCents: { type: integer, minimum: 0, description: Desbloqueio específico do modelo (ausente = o do plano). }
        serviceIntervalKm: { type: integer, minimum: 1, examples: [1000] }
        serviceIntervalHours: { type: integer, minimum: 1, examples: [100] }
        active: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehicleModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VehicleModel' }
    VehicleModelInput:
      type: object
      required: [name, slug, categoryLabel, pricePerMinuteCents]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        slug: { type: string, pattern: '^[a-z0-9-]{2,40}$' }
        categoryLabel: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        photoObjectKey: { type: string, maxLength: 300, pattern: '^catalog/[A-Za-z0-9._-]+$', description: 'Chave devolvida por `POST /vehicle-models/uploads` (prefixo `catalog/`).' }
        pricePerMinuteCents: { type: integer, minimum: 0, maximum: 10000 }
        unlockFeeCents: { type: integer, minimum: 0, maximum: 10000 }
        serviceIntervalKm: { type: integer, minimum: 1, maximum: 100000, default: 1000 }
        serviceIntervalHours: { type: integer, minimum: 1, maximum: 10000, default: 100 }
        active: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: 0, maximum: 1000, default: 0 }
    VehicleModelUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        categoryLabel: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        photoObjectKey: { type: string, maxLength: 300, pattern: '^catalog/[A-Za-z0-9._-]+$', description: 'Chave devolvida por `POST /vehicle-models/uploads` (prefixo `catalog/`).' }
        pricePerMinuteCents: { type: integer, minimum: 0, maximum: 10000 }
        unlockFeeCents: { type: integer, minimum: 0, maximum: 10000 }
        inheritPlanUnlockFee: { type: boolean, description: '`true` remove o desbloqueio próprio do modelo (volta ao do plano). A API também aceita `unlockFeeCents: null`.' }
        serviceIntervalKm: { type: integer, minimum: 1, maximum: 100000 }
        serviceIntervalHours: { type: integer, minimum: 1, maximum: 10000 }
        active: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }

    # estações
    SwapStation:
      type: object
      required: [id, name, address, lat, lng, availableBatteries, totalSlots, openingHours]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Estação Largo da Batata] }
        address: { type: string, examples: ['R. Teodoro Sampaio, 2000 · Pinheiros, São Paulo'] }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        availableBatteries: { type: integer, minimum: 0, description: Baterias carregadas prontas para troca. }
        totalSlots: { type: integer, minimum: 0 }
        openingHours: { type: string, examples: ['Seg a sáb, 7h às 22h'] }
        open24h: { type: boolean }
        distanceM: { type: integer, minimum: 0, description: Só com `lat`/`lng` na busca. }
    SwapStationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SwapStation' }
    SwapStationAdmin:
      type: object
      description: Estação com os campos de cadastro (só staff admin/operacao). Nunca traz o QR (`stationCode`).
      required: [id, name, address, lat, lng, availableBatteries, totalSlots, openingHours, open24h, active, thingName, batteriesInStation, openSwaps, depotIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Estação Largo da Batata] }
        address: { type: string }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        availableBatteries: { type: integer, minimum: 0, description: Baterias carregadas prontas para troca. }
        totalSlots: { type: integer, minimum: 0 }
        openingHours: { type: string, examples: ['Seg a sáb, 7h às 22h'] }
        open24h: { type: boolean }
        active: { type: boolean }
        thingName: { type: string, description: '*Thing* do armário no IoT Core (tópicos `estacoes/{thing}/comandos` e `/eventos`).', examples: ['station-d0000000-0000-4000-8000-000000000001'] }
        batteriesInStation: { type: integer, minimum: 0, description: 'Baterias `in_station` registradas nesta estação (carregadas ou não).' }
        openSwaps: { type: integer, minimum: 0, description: Trocas por QR em andamento. }
        depotIds:
          type: array
          description: Galpões ligados a esta estação (`Depot.swapStationId`).
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SwapStationAdminList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SwapStationAdmin' }
    SwapStationInput:
      type: object
      required: [name, address, lat, lng, totalSlots]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, minLength: 1, maxLength: 300 }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        openingHours: { type: string, maxLength: 120, description: 'Obrigatório sem `open24h` (`400`).', examples: ['Seg a sáb, 7h às 22h'] }
        open24h: { type: boolean, default: false }
        totalSlots: { type: integer, minimum: 1, maximum: 200 }
        thingName: { type: string, pattern: '^station-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', description: 'Padrão `station-{id}`.' }
        active: { type: boolean, default: true }
    SwapStationUpdate:
      type: object
      description: Campos ausentes não mudam. `openingHours` vazio só com `open24h` (`400`).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, minLength: 1, maxLength: 300 }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        openingHours: { type: string, maxLength: 120 }
        open24h: { type: boolean }
        totalSlots: { type: integer, minimum: 1, maximum: 200 }
        thingName: { type: string, pattern: '^station-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
        active: { type: boolean }
    StationSwapStatus:
      type: string
      enum: [opening_slot, awaiting_return, returned, releasing, completed, canceled, failed]
      description: |
        `opening_slot` (estação abrindo uma vaga vazia) → `awaiting_return` (vaga aberta, devolva a bateria) → `returned`
        (devolvida) → `releasing` (vaga fechada, liberando a carregada) → `completed`. Finais: `completed`, `canceled`,
        `failed` (ver `endReason`).
    StationSwapEndReason:
      type: string
      enum: [canceled_by_customer, slot_closed_without_return, station_timeout, return_timeout, release_timeout, no_battery_after_return, serial_mismatch, return_after_close, rental_force_ended]
      description: |
        Por que a troca terminou sem `completed`: cancelada pelo cliente; vaga fechada sem bateria; estação não abriu a vaga
        em 3 min (`failed`); cliente não devolveu em 3 min (`canceled`); estação não liberou a carregada em 3 min depois da
        devolução (`failed`, abre alerta para a operação); bateria devolvida depois do cancelamento/prazo sem carregada para
        liberar (`failed`, alerta: a operação leva uma bateria); bateria devolvida ou liberada consta instalada em outra moto
        (`failed`, alerta: conferir a estação); bateria devolvida depois do cancelamento/prazo, mas com o aluguel já
        encerrado ou com outra troca aberta no aluguel (`return_after_close`: `failed`, a devolução fica registrada, alerta);
        aluguel encerrado pelo staff (forçado ou chegada no galpão) com a troca ainda sem devolução (`rental_force_ended`:
        `canceled`). Uma devolução que chega depois de `canceled_by_customer`, `return_timeout` ou `station_timeout`, com o
        aluguel ainda em andamento e sem outra troca aberta, vale: a troca volta para `releasing` (sem `endReason`) e a
        estação libera uma carregada. Devolução numa troca encerrada por qualquer outro motivo só entra no estoque (alerta
        para a operação).
    StationSwapRequest:
      type: object
      required: [stationCode, rentalId, lat, lng]
      properties:
        stationCode: { type: string, minLength: 1, maxLength: 256, description: Conteúdo do QR fixo da estação. }
        rentalId: { type: string, format: uuid }
        lat: { type: number, format: double, minimum: -90, maximum: 90, description: Posição do celular (só para a validação de 50 m). }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
    StationSwap:
      type: object
      required: [id, stationId, rentalId, status, feeCents, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StationSwapStatus' }
        endReason: { $ref: '#/components/schemas/StationSwapEndReason' }
        slotNumber: { type: integer, minimum: 1, description: Vaga aberta (a partir de `awaiting_return`). }
        feeCents: { type: integer, minimum: 0, description: 'Taxa da troca (0 nos planos diário/semanal/mensal); cobrada no fechamento do aluguel.' }
        expiresAt: { type: string, format: date-time, description: Prazo da etapa atual (3 min por etapa). }
        returnedSerial: { type: string, description: Nº de série da bateria devolvida. }
        returnedPct: { type: integer, minimum: 0, maximum: 100, description: Carga da bateria devolvida. }
        releasedSerial: { type: string, description: Nº de série da bateria liberada (instalada na moto). }
        distanceM: { type: integer, minimum: 0, description: 'Só staff: distância do celular à estação na validação.' }
        customerId: { type: string, format: uuid, description: Só staff. }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SwapStationQr:
      type: object
      required: [stationId, stationCode]
      properties:
        stationId: { type: string, format: uuid }
        stationCode: { type: string, description: 'Conteúdo do QR (`vst1.<stationId>.<assinatura>`), sem dado pessoal.', examples: ['vst1.d0000000-0000-4000-8000-000000000001.lMyoiWvb5xuRTHIzBFoxEQ'] }
    StationSwapPage:
