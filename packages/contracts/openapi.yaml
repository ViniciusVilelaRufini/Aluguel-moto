        horário (`pickupAt`, ou `createdAt` em `now`), em qualquer status (`active`, `handover`, `converted`,
        `canceled`, `expired`); `status` filtra. Do cliente, só `customerFirstName`; nunca vem `pickupCode`.
      security:
