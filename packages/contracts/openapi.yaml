        maxScheduleDays: { type: integer, minimum: 0, maximum: 30, default: 7, description: Quantos dias à frente o cliente pode agendar. }
        scheduledGraceMinutes: { type: integer, minimum: 0, maximum: 120, default: 30, description: Tolerância depois do horário agendado. }
        swapStationId: { type: string, format: uuid, description: Estação de troca de bateria do próprio galpão (`GET /swap-stations`). }
        minChargedBatteries: { type: integer, minimum: 0, maximum: 1000, description: 'Só para staff. Mínimo de baterias `charged` no galpão; abaixo dele abre o alerta `battery_stock_low`. Ausente ou 0 = sem alerta.' }
        active: { type: boolean }
        availableVehicleCount: { type: integer, minimum: 0, description: 'Motos `free` neste galpão.', examples: [12] }
        distanceM: { type: integer, minimum: 0, description: 'Só com `lat`/`lng` em `GET /depots`.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DepotInput:
      type: object
      required: [name, address, lat, lng, openingHours]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, minLength: 1, maxLength: 300 }
        district: { type: string, maxLength: 80 }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        timezone: { type: string, maxLength: 64, default: America/Sao_Paulo }
        openingHours:
          type: array
          maxItems: 7
          items: { $ref: '#/components/schemas/DepotOpeningHours' }
        pickupNowWindowMinutes: { type: integer, minimum: 15, maximum: 480, default: 120 }
        maxScheduleDays: { type: integer, minimum: 0, maximum: 30, default: 7 }
        scheduledGraceMinutes: { type: integer, minimum: 0, maximum: 120, default: 30 }
        swapStationId: { type: string, format: uuid }
        minChargedBatteries: { type: integer, minimum: 0, maximum: 1000, description: 'Ausente ou 0 = sem alerta de estoque.' }
        active: { type: boolean, default: true }
    DepotUpdate:
      type: object
      description: Campos ausentes não mudam; `openingHours` substitui a lista inteira.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, minLength: 1, maxLength: 300 }
        district: { type: string, maxLength: 80 }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        timezone: { type: string, maxLength: 64 }
        openingHours:
          type: array
          maxItems: 7
          items: { $ref: '#/components/schemas/DepotOpeningHours' }
        pickupNowWindowMinutes: { type: integer, minimum: 15, maximum: 480 }
        maxScheduleDays: { type: integer, minimum: 0, maximum: 30 }
        scheduledGraceMinutes: { type: integer, minimum: 0, maximum: 120 }
        swapStationId: { type: string, format: uuid, description: 'Liga o galpão à estação de troca (inexistente → `400`).' }
        clearSwapStation: { type: boolean, description: '`true` desliga o galpão da estação de troca (o contrato não usa `null`). Junto com `swapStationId` → `400`.' }
        minChargedBatteries: { type: integer, minimum: 0, maximum: 1000, description: '0 desliga o alerta de estoque.' }
        active: { type: boolean }
    DepotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Depot' }
    DepotVehicleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
    DepotPickupList:
      type: object
      required: [date, items]
      properties:
        date: { type: string, format: date, examples: ['2026-10-22'] }
        items:
          type: array
          description: Reservas do dia em ordem de horário, com `customerFirstName` e sem `pickupCode`.
          items: { $ref: '#/components/schemas/Reservation' }

    # ───────────── entregas no galpão ─────────────
    HandoverType:
      type: string
      enum: [pickup, return_depot]
      description: '`pickup` = saída do galpão com aceite do cliente; `return_depot` = chegada no galpão (encerra o aluguel).'
    HandoverStatus:
      type: string
      enum: [pending_customer, accepted, disputed, canceled]
    HandoverChecklistItem:
      type: object
      required: [code, ok]
      properties:
        code: { type: string, minLength: 1, maxLength: 40, description: 'Item do checklist (ex.: `freios`, `pneus`, `luzes`, `carenagem`).', examples: [freios] }
        ok: { type: boolean }
        note: { type: string, maxLength: 500 }
    HandoverDispute:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, examples: [Retrovisor esquerdo quebrado.] }
    HandoverCancel:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, examples: [Cliente apontou retrovisor quebrado; moto trocada.] }
    HandoverCreate:
      type: object
      required: [type, checklist, photoKeys, batteryPct]
      properties:
        type: { $ref: '#/components/schemas/HandoverType' }
        depotId: { type: string, format: uuid, description: 'Galpão onde a entrega acontece. Obrigatório em `return_depot` (`400`); em `pickup` precisa ser o da reserva, quando enviado.' }
        pickupCode: { type: string, minLength: 8, maxLength: 256, description: 'Só em `pickup` (obrigatório): conteúdo do QR da reserva.' }
        rentalId: { type: string, format: uuid, description: 'Só em `return_depot` (obrigatório): aluguel que chega.' }
        checklist:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/HandoverChecklistItem' }
        photoKeys:
          type: array
          maxItems: 12
          description: Chaves devolvidas por `POST /handovers/uploads` (prefixo `handovers/`).
          items: { type: string, pattern: '^handovers/', maxLength: 300 }
        batteryPct: { type: integer, minimum: 0, maximum: 100 }
        batterySerial: { type: string, maxLength: 64 }
    Handover:
      type: object
      required: [id, type, depotId, vehicleId, operatorId, checklist, photoKeys, batteryPct, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/HandoverType' }
        depotId: { type: string, format: uuid }
        reservationId: { type: string, format: uuid }
        rentalId: { type: string, format: uuid, description: Preenchido no aceite (`pickup`) ou desde a criação (`return_depot`). }
        vehicleId: { type: string, format: uuid }
        vehicleCode: { type: string, examples: [VLT-0001] }
        operatorId: { type: string, format: uuid }
        operatorFirstName: { type: string, description: 'Só o primeiro nome cadastrado do operador ("Entregue por <nome>"), nunca o nome completo nem algo derivado do e-mail; sem nome cadastrado, "Equipe Volti".', examples: [Rafael] }
        checklist:
          type: array
          items: { $ref: '#/components/schemas/HandoverChecklistItem' }
        photoKeys:
          type: array
          items: { type: string }
        photoUrls:
          type: array
          description: Links assinados (24 h), na mesma ordem de `photoKeys`.
          items: { type: string, format: uri }
        batteryPct: { type: integer, minimum: 0, maximum: 100 }
        batterySerial: { type: string }
        status: { $ref: '#/components/schemas/HandoverStatus' }
        lastError: { type: string, description: 'Slug do último erro do aceite (ex.: `payment-declined`); some quando o aceite dá certo.', examples: [payment-declined] }
        disputeReason: { type: string }
        cancelReason: { type: string, description: 'staff. Motivo do cancelamento (`POST /handovers/{id}/cancel`), lido do AuditLog.' }
        canceledAt: { type: string, format: date-time, description: staff. Quando foi cancelada. }
        canceledByName: { type: string, description: staff. Nome de quem cancelou. }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, description: Aceite ou disputa do cliente. }
    HandoverPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Handover' }
        nextCursor: { type: string }
