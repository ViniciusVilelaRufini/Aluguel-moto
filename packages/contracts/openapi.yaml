        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /swap-stations/{id}/swaps/{swapId}/cancel:
    parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/SwapId'
    post:
      tags: [stations]
      operationId: cancelStationSwap
      summary: Cancelar troca na estação
      description: |
        Só o dono e só antes da devolução (`opening_slot` ou `awaiting_return`) → `canceled`
        (`endReason: canceled_by_customer`). Depois disso → `422` `swap-not-cancelable` (a estação precisa liberar a
        carregada). Troca já cancelada → `200` como está. Bateria devolvida mesmo assim entra no estoque da estação.
      security:
        - customerAuth: []
      responses:
        '200':
          description: Troca cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationSwap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── galpões ─────────────────────────────
  /depots:
    get:
      tags: [depots]
