  # ───────────────────────────── payments ─────────────────────────────
  /payments/cards:
    get:
      tags: [payments]
      operationId: listPaymentCards
      summary: Cartões do cliente
      security:
        - customerAuth: []
      responses:
        '200':
          description: Cartões tokenizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCardList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [payments]
      operationId: addPaymentCard
      summary: Cadastrar cartão (token do gateway)
      description: |
        Recebe **só** o token gerado no app pelo SDK do Mercado Pago. Número, CVV e validade nunca chegam ao backend.
        O primeiro cartão ativo do cliente vira o padrão (`isDefault: true`); com `setDefault: true` o novo cartão passa
        a ser o padrão e o anterior deixa de ser.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCardCreate' }
      responses:
        '201':
          description: Cartão cadastrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payments/cards/{id}:
    delete:
      tags: [payments]
      operationId: deletePaymentCard
      summary: Remover cartão
      description: |
        Não remove cartão com caução retida ou assinatura ativa (`409`). Ao remover o cartão padrão, o cartão ativo
        cadastrado mais recentemente vira o padrão (o cliente nunca fica com cartões e sem padrão).
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Cartão removido.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/cards/{id}/default:
    put:
      tags: [payments]
      operationId: setDefaultPaymentCard
      summary: Definir o cartão padrão
      description: |
        Torna o cartão o padrão do cliente (os demais ficam `isDefault: false`). Idempotente: repetir não muda nada.
        O cartão padrão é o usado quando `cardId` não é enviado (caução da reserva e do aluguel, assinatura, recarga,
        cobrança do fechamento e quitação de dívida). Cartão de outro cliente ou removido → `404`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Cartão padrão.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/deposits:
    get:
      tags: [payments]
      operationId: listDeposits
      summary: Listar cauções
      security:
        - staffAuth: []
      x-required-groups: [admin, financeiro]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DepositStatus' }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de cauções.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /payments/deposits/{id}:
    get:
      tags: [payments]
      operationId: getDeposit
      summary: Estado da caução
      description: O app consulta enquanto espera o pagamento do Pix (`awaiting_pix` → `held`).
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, financeiro, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Caução.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/subscriptions:
    get:
      tags: [payments]
      operationId: listSubscriptions
      summary: Assinaturas do cliente (planos semanal e mensal)
      security:
        - customerAuth: []
      responses:
        '200':
          description: Assinaturas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [payments]
      operationId: createSubscription
      summary: Assinar plano semanal ou mensal
      description: |
        Cobrança recorrente no cartão (`cardId` ou, sem ele, o cartão padrão). Com assinatura ativa, aluguéis com o mesmo
        `planCode` não cobram tempo (só seguro e taxas). Uma assinatura ativa por cliente (`409`). Sem nenhum cartão
        ativo → `422` `card-required` ("Cadastre um cartão para assinar."); `cardId` inexistente → `402` `card-not-found`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreate' }
      responses:
        '201':
          description: Assinatura criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payments/subscriptions/{id}:
    get:
      tags: [payments]
      operationId: getSubscription
      summary: Detalhe da assinatura (próxima cobrança, pausa, moto fixa)
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Assinatura.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [payments]
      operationId: cancelSubscription
      summary: Cancelar assinatura
      description: Cancela a renovação; o período atual continua válido até `currentPeriodEnd`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Assinatura cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/subscriptions/{id}/pause:
    post:
      tags: [payments]
      operationId: pauseSubscription
      summary: Pausar assinatura
      description: |
        Suspende o plano por `days` dias; o período e a próxima cobrança andam o tempo efetivamente pausado.
        Limites: até 3 dias por pausa no semanal e 7 no mensal, uma pausa por período de cobrança
        (`422` `subscription-pause-limit-reached`). Só assinatura `active` sem cancelamento agendado
        (`409` `subscription-not-pausable`) e sem aluguel em andamento no plano (`409` `rental-already-active`).
        Durante a pausa, aluguéis no plano não são cobertos. Retoma sozinha em `pauseEndsAt`. O gateway de pagamento é a
        fonte da verdade das datas: se ele não confirmar a pausa, nada muda e a resposta é `503` `gateway-unavailable`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionPauseRequest' }
      responses:
        '200':
          description: Assinatura pausada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /payments/subscriptions/{id}/resume:
    post:
      tags: [payments]
      operationId: resumeSubscription
      summary: Retomar assinatura pausada
      description: Antecipa o fim da pausa. Só `paused` (senão `409` `subscription-not-pausable`). `currentPeriodEnd` e `nextChargeAt` andam o tempo pausado e a nova data da cobrança é enviada ao gateway; sem confirmação do gateway → `503` `gateway-unavailable` (continua pausada).
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Assinatura ativa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /payments/subscriptions/{id}/vehicle:
    put:
      tags: [payments]
      operationId: assignSubscriptionVehicle
      summary: Definir a moto fixa do plano
      description: |
        A moto fixa só pode ser alugada pelo assinante enquanto a assinatura estiver `active` ou `paused` e some do
        `GET /vehicles/nearby` dos demais clientes. Cliente: só a própria assinatura e uma moto `free` sem outro
        assinante (`409` `vehicle-unavailable`); o cliente troca a moto fixa no máximo uma vez a cada 24 h
        (`422` `subscription-vehicle-cooldown`). Staff (`admin`, `operacao`): qualquer assinatura e moto, sem espera; grava AuditLog.
        A exclusividade vale só com o período vigente (`currentPeriodEnd` no futuro).
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionVehicleAssignment' }
      responses:
        '200':
          description: Moto fixa definida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payments:
    get:
      tags: [payments]
      operationId: listPayments
      summary: Listar pagamentos
      description: Cliente vê só os próprios (filtros de staff são ignorados).
      security:
        - customerAuth: []
        - staffAuth: []
