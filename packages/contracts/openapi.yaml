    IncidentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        nextCursor: { type: string }
    Dispute:
      type: object
      required: [id, customerId, rentalId, status, reason, createdAt, updatedAt]
