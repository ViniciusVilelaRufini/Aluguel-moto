openapi: 3.1.0
info:
  title: Volti API
  version: 0.1.0
  summary: API da plataforma Volti de aluguel de motos elétricas autopropelidas.
  description: |
    Contrato REST da plataforma Volti. Este arquivo é a **fonte da verdade**: a API NestJS, o painel
    (cliente TypeScript gerado) e os apps Flutter (pacote Dart `volti_api` gerado) seguem este contrato.
    Mudanças depois da aprovação da Task 1 são propostas em `docs/decisoes.md` e aprovadas pelo usuário.

    ## Regras não negociáveis
    - Velocidade máxima absoluta: **32 km/h**. Todo `speedLimitKmh` aceita só `0..32`; valores fora
      disso são rejeitados com `400` (`speed-limit-out-of-range`), nunca truncados.
    - Zonas `reduced_speed`: 6 km/h (pedestres) ou 20 km/h (ciclovias), sempre `speedLimitKmh <= 20`.
    - Bloqueio seguro: o rastreador só trava abaixo de 3 km/h; antes disso o limite é reduzido em rampa.
    - LGPD: trajetos só durante o aluguel e com consentimento; expiram após 90 dias; o cliente exporta e
      exclui os próprios dados.
    - Dados de cartão nunca passam pelo backend: só tokens do gateway (`cardToken`).

    ## Convenções
    - Campos em inglês, camelCase. Dinheiro em centavos (`amountCents`, `...Cents`, inteiros, BRL).
    - Datas em UTC ISO 8601 (`format: date-time`); a exibição usa `America/Sao_Paulo`.
    - IDs são UUID. O código visível da moto é `VLT-0001` (também impresso no QR).
    - Paginação por cursor: `?cursor=&limit=` → `{ items, nextCursor }`. `nextCursor` fica **ausente** na
      última página.
    - `Idempotency-Key` (header) é obrigatório em `POST /rentals`, `POST /swap-stations/{id}/swaps` e nos POST de pagamento. A mesma chave
      com o mesmo corpo devolve a mesma resposta sem repetir o efeito; com corpo diferente → `422`
      (`idempotency-key-reused`). Chaves valem por 24 h.
    - Rate limiting global; acima do limite → `429` com `Retry-After`.

    ## Erros (RFC 7807)
    Todo erro é `application/problem+json` (schema `Problem`). O campo `type` é
    `https://api.volti.com.br/problems/<slug>`. Slugs conhecidos:
    `validation-error`, `unauthorized`, `forbidden`, `not-found`, `rate-limited`, `idempotency-key-reused`,
    `speed-limit-out-of-range`, `kyc-not-approved`, `kyc-underage`, `customer-blocked`,
    `customer-delinquent`, `vehicle-unavailable`, `vehicle-offline`, `reservation-already-active`,
    `rental-already-active`, `rental-not-active`, `rental-outside-return-zone`, `return-photo-missing`,
    `rental-lock-not-confirmed`, `force-end-outside-zone-requires-admin`, `insurance-required`,
    `coupon-invalid`, `deposit-not-held`, `payment-failed`, `card-not-found`, `zone-invalid-geometry`,
    `zone-speed-limit-required`, `zone-speed-limit-invalid`, `location-consent-required`,
    `speed-limiter-noncompliant`, `battery-serials-must-differ`, `account-deletion-blocked`,
    `webhook-signature-invalid`, `pix-key-invalid`, `top-up-amount-out-of-range`, `subscription-not-pausable`,
    `subscription-pause-limit-reached`, `subscription-required`, `subscription-vehicle-required`,
    `maintenance-slot-unavailable`, `referral-code-invalid`, `referral-not-eligible`, `gateway-unavailable`,
    `subscription-vehicle-cooldown`, `reservation-open`, `pickup-outside-hours`, `pickup-too-far-ahead`,
    `depot-inactive`, `handover-not-pending`, `payment-declined`, `reservation-in-handover`, `station-not-found`,
    `station-unavailable`, `vehicle-moving`, `too-far`, `swap-open`, `swap-not-cancelable`, `depot-required`,
    `thing-name-taken`, `station-swap-in-progress`, `slots-below-stock`, `debt-not-payable`, `debt-in-collection`,
    `payment-pending`, `card-required`, `vehicle-locked-by-staff`.

    ## Autenticação e grupos
    - `customerAuth`: JWT do User Pool de clientes (Cognito) ou, com `AUTH_MODE=dev`, emitido por
      `POST /dev/token` com `pool: customer`.
    - `staffAuth`: JWT do User Pool interno (MFA obrigatório), claim `cognito:groups` com valores de
      `StaffGroup`. Em dev, `POST /dev/token` com `pool: staff`.
    - A extensão `x-required-groups` em cada operação de staff lista os grupos que podem chamá-la
      (basta pertencer a um deles). Quando a operação aceita os dois esquemas, a lista vale só para
      tokens de staff. Visibilidade: `admin` tudo; `operacao` frota, cercas, alertas e campo;
      `financeiro` financeiro, relatórios e aluguéis (leitura); `suporte` clientes, aluguéis e
      suporte; `campo` tarefas de campo e destravar em serviço.
    - Dados pessoais são minimizados por grupo: CPF completo só para `admin`; os demais recebem
      `***.456.789-**`.

    ## Tempo real
    Eventos WebSocket (Socket.IO, namespace `/realtime`) estão em `packages/contracts/realtime.md`. Os eventos da
    entrega no galpão (`handover.*`) também estão descritos na extensão `x-ws-events` deste arquivo.

    ## Retirada em galpão
    As motos ficam num galpão (`Depot`). Disponível para retirada = `status: free` com `depotId` preenchido.
    O cliente reserva com `POST /reservations` informando `depotId` (retirar agora ou agendar); o operador lê o
    `pickupCode`, faz o checklist de saída (`POST /handovers`) e o cliente confere e aceita
    (`POST /handovers/{id}/accept`), o que cria o aluguel, cobra o plano e destrava a moto.
    **Moto do galpão só sai pela entrega:** moto com `depotId`, ou separada por uma reserva de galpão, responde
    `409` `vehicle-unavailable` em `POST /rentals` e na reserva de rua (sem `depotId`), e some do
    `GET /vehicles/nearby` do cliente (assim como `awaiting_pickup`).
  contact:
    name: Volti
    email: dev@volti.com.br
servers:
  - url: http://localhost:3000
    description: API local (docker compose)
  - url: http://localhost:4010
    description: Mock Prism gerado deste contrato
tags:
  - name: health
    description: Saúde do serviço (health check do ALB).
  - name: auth
    description: Sessão, perfil do usuário autenticado e emissor de tokens de desenvolvimento.
  - name: kyc
    description: Verificação de identidade (documento, selfie com prova de vida, regra de 18+).
  - name: vehicles
    description: Motos, busca por proximidade e autonomia, ficha da moto.
  - name: zones
    description: Cercas (operação, devolução, proibida, velocidade reduzida) em GeoJSON.
  - name: reservations
    description: Reserva de moto com expiração (uma por cliente).
  - name: rentals
    description: Ciclo do aluguel — iniciar, pausar, retomar, trocar de moto, encerrar, recibo.
  - name: pricing
    description: Planos, cotação, cupons e taxas.
  - name: commands
    description: Comandos remotos à moto (bloquear, desbloquear, buzina, limitar velocidade, modo roubada).
  - name: payments
    description: Cartões tokenizados, pagamentos, cauções, estornos e assinaturas.
  - name: wallet
    description: Carteira de créditos e pacotes de minutos (ledger somente inserção).
  - name: insurance
    description: Coberturas de seguro e apólices por aluguel.
  - name: alerts
    description: Fila de alertas operacionais.
  - name: support
    description: Incidentes, contestações, sinistros e chat de suporte.
  - name: field-tasks
    description: Tarefas de campo, inspeção, troca de bateria e destravar em modo serviço.
  - name: maintenance
    description: Manutenção preventiva e corretiva.
  - name: reports
    description: Dashboard e relatórios (receita, ocupação, receita por moto, financeiro).
  - name: customers
    description: Gestão de clientes pelo time interno.
  - name: staff
    description: Usuários internos e grupos.
  - name: audit
    description: Log de auditoria de comandos e alterações sensíveis.
  - name: public
    description: Rotas públicas sem autenticação (link de localização compartilhada do SOS).
  - name: lgpd
    description: Consentimentos, exportação e exclusão de dados pessoais.
  - name: webhooks
    description: Webhooks de provedores externos.
  - name: catalog
    description: Catálogo de modelos de moto (nome, categoria, foto e preço por minuto).
  - name: stations
    description: Estações de troca de bateria.
  - name: referrals
    description: Programa de indicação de amigos.
  - name: depots
    description: Galpões da Volti (endereço, horário de funcionamento, prazos de retirada, motos e agenda).
  - name: handovers
    description: Entrega formal da moto no galpão (checklist de saída com aceite do cliente e checklist de chegada).
  - name: batteries
    description: Baterias (série, carga, ciclos) e estoque na van do operador.

x-ws-events:
  handover.pending:
    description: |
      O operador criou a entrega de saída (`POST /handovers`, `type: pickup`). O app abre "Confira sua moto" e carrega
      `GET /handovers/{handoverId}`.
    rooms: ['customer:{customerId}', 'depot:{depotId}']
    payload:
      type: object
      required: [handoverId, reservationId]
      properties:
        handoverId: { type: string, format: uuid }
        reservationId: { type: string, format: uuid }
  handover.updated:
    description: |
      Mudança de status da entrega (aceite, disputa, cancelamento) ou falha no aceite (`lastError`, ex.:
      `payment-declined`, com a entrega ainda `pending_customer`). O operador vê "Aceito", "Pagamento não aprovado"
      ou "Problema apontado".
    rooms: ['customer:{customerId}', 'depot:{depotId}']
    payload:
      type: object
      required: [handoverId, status]
      properties:
        handoverId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/HandoverStatus' }
        lastError: { type: string }
  station_swap.updated:
    description: |
      Troca de bateria na estação mudou de status (`StationSwapStatus`). Só para o dono, sem posição nem número de série;
      detalhes por `GET /swap-stations/{id}/swaps/{swapId}`.
    rooms: ['customer:{customerId}']
    payload:
      type: object
      required: [swapId, status]
      properties:
        swapId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StationSwapStatus' }
paths:
  # ───────────────────────────── health ─────────────────────────────
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Saúde do serviço
      description: Usado pelo health check do ALB. Não exige autenticação.
      security: []
      responses:
        '200':
          description: Serviço saudável (ou degradado, ainda atendendo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Serviço indisponível.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────────── auth ─────────────────────────────
  /dev/token:
    post:
      tags: [auth]
      operationId: createDevToken
      summary: Emitir token de desenvolvimento
      description: |
        Existe **somente** com `AUTH_MODE=dev` (em produção a rota não é registrada e responde 404).
        Emite um JWT HS256 do emissor local `volti-dev` com as mesmas claims do Cognito
        (`sub`, `email`, `cognito:groups`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevTokenRequest' }
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuário autenticado
      description: Devolve o perfil do dono do token (cliente ou staff). Cria o cadastro do cliente no primeiro acesso.
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte, campo]
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Atualizar o próprio perfil (cliente)
      description: 'Inclui a chave Pix para estornos (`pixRefundKeyType` + `pixRefundKey`; inválida → `422` `pix-key-invalid`).'
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/devices:
    post:
      tags: [auth]
      operationId: registerDevice
      summary: Registrar dispositivo para push (FCM)
      description: Idempotente por `fcmToken`. Usado pelos apps do cliente e do operador.
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte, campo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '204':
          description: Dispositivo registrado.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── conta do cliente: cupons, indicação e manutenção (contrato v2, docs/decisoes.md 2026-10-22) ──
  /me/coupons:
    get:
      tags: [pricing]
      operationId: listMyCoupons
      summary: Cupons salvos na conta
      description: |
        Cupons que o cliente adicionou à conta (`POST /me/coupons`) ou ganhou por indicação. `status` é calculado na
        leitura: `used` quando o limite por cliente foi atingido, `expired` quando passou de `validUntil` ou o cupom foi
        desativado. Para usar, o app envia `couponCode` em `POST /pricing/quote` e `POST /rentals`.
      security:
        - customerAuth: []
      responses:
        '200':
          description: Cupons da conta (disponíveis primeiro).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCouponList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [pricing]
      operationId: addMyCoupon
      summary: Adicionar cupom à conta
      description: |
        Valida o código (mesmas regras do aluguel: ativo, vigência, limite total e por cliente) e o salva na conta.
        Código inválido → `422` `coupon-invalid` (`detail` com o motivo em pt-BR); já salvo → `409` `conflict`.
        Códigos de indicação não são cupons: use `POST /me/referral/redeem`.
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponCodeRequest' }
      responses:
        '201':
          description: Cupom salvo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCoupon' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/coupons/validate:
    post:
      tags: [pricing]
      operationId: validateMyCoupon
      summary: Validar cupom sem salvar
      description: 'Sempre `200`; `valid = false` traz `message` com o motivo. `planCode` opcional restringe a validação a um plano.'
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponCodeRequest' }
      responses:
        '200':
          description: Resultado da validação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/referral:
    get:
      tags: [referrals]
      operationId: getMyReferral
      summary: Programa de indicação do cliente
      description: |
        Código de indicação do cliente (gerado no primeiro acesso, único), link de convite, valores das recompensas e
        totais. Regras: quem usa o código ganha `refereeRewardCents` na carteira na hora; quem indicou ganha
        `referrerRewardCents` quando o indicado termina a primeira corrida.
      security:
        - customerAuth: []
      responses:
        '200':
          description: Resumo da indicação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/referral/rewards:
    get:
      tags: [referrals]
      operationId: listMyReferralRewards
      summary: Recompensas de indicação
      description: Uma linha por amigo indicado (mais recentes primeiro). `granted` tem o lançamento `bonus` correspondente no extrato da carteira.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de recompensas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralRewardPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/referral/redeem:
    post:
      tags: [referrals]
      operationId: redeemReferralCode
      summary: Usar código de indicação de um amigo
      description: |
        Só antes da primeira corrida e uma vez por conta. Código inexistente → `422` `referral-code-invalid`; próprio
        código, já indicado, conta com corrida ou conta sem KYC aprovado → `422` `referral-not-eligible`. Credita
        `rewardCents` na carteira (lançamento `bonus`).
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralRedeemRequest' }
      responses:
        '201':
          description: Indicação registrada e bônus creditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralRedemption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/maintenance-slots:
    get:
      tags: [maintenance]
      operationId: listMyMaintenanceSlots
      summary: Horários livres para manutenção (plano semanal/mensal)
      description: |
        Janelas de 1 h, segunda a sábado, 08:00–18:00 (America/Sao_Paulo), a partir da próxima hora cheia com 2 h de
        antecedência e até `days` dias. Cada janela tem capacidade fixa; janelas lotadas vêm com `available: false`.
        Exige assinatura semanal/mensal ativa (`403` `subscription-required`).
      security:
        - customerAuth: []
      parameters:
        - name: days
          in: query
          description: Quantos dias à frente listar.
          schema: { type: integer, minimum: 1, maximum: 14, default: 7 }
      responses:
        '200':
          description: Janelas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceSlotList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/maintenance-requests:
    get:
      tags: [maintenance]
      operationId: listMyMaintenanceRequests
      summary: Manutenções agendadas pelo cliente
      security:
        - customerAuth: []
      responses:
        '200':
          description: Pedidos (mais recentes primeiro).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerMaintenanceRequestList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [maintenance]
      operationId: createMyMaintenanceRequest
      summary: Agendar manutenção da moto fixa do plano
      description: |
        Cria uma manutenção preventiva (`MaintenanceTask` com `source: customer`) para a moto fixa da assinatura ativa,
        visível na Operação do painel. Regras: assinatura ativa (`403` `subscription-required`), moto fixa definida
        (`422` `subscription-vehicle-required`), `slotStartsAt` igual ao início de uma janela livre de
        `GET /me/maintenance-slots` (`409` `maintenance-slot-unavailable`) e um pedido em aberto por vez (`409` `conflict`).
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerMaintenanceRequestCreate' }
      responses:
        '201':
          description: Manutenção agendada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerMaintenanceRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/maintenance-requests/{id}:
    delete:
      tags: [maintenance]
      operationId: cancelMyMaintenanceRequest
      summary: Cancelar manutenção agendada
      description: Só enquanto `scheduled` (senão `409`). A manutenção vira `canceled`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Pedido cancelado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerMaintenanceRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── kyc ─────────────────────────────
  /kyc/uploads:
    post:
      tags: [kyc]
      operationId: createKycUploads
      summary: URLs pré-assinadas para documento e selfie
      description: Devolve URLs `PUT` pré-assinadas (S3/MinIO) para a foto do documento (frente e, se houver, verso) e para a selfie com prova de vida. Válidas por 15 minutos.
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycUploadRequest' }
      responses:
        '201':
          description: URLs criadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycUploads' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /kyc/submit:
    post:
      tags: [kyc]
      operationId: submitKyc
      summary: Enviar verificação de identidade
      description: |
        Envia os dados e as chaves dos arquivos já enviados. O provedor de KYC (mock em dev: aprova se 18+,
        reprova CPF terminado em `00`) responde de forma assíncrona; o status fica `pending` até a decisão.
        Menor de 18 anos → `422` (`kyc-underage`).
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycSubmitRequest' }
      responses:
        '202':
          description: Verificação recebida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /kyc/status:
    get:
      tags: [kyc]
      operationId: getKycStatus
      summary: Status da verificação
      security:
        - customerAuth: []
      responses:
        '200':
          description: Status atual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /customers/{id}/kyc-review:
    post:
      tags: [kyc]
      operationId: reviewCustomerKyc
      summary: Revisão manual da verificação
      description: Decisão manual do time interno (por exemplo, documento ilegível no provedor). Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycReviewRequest' }
      responses:
        '200':
          description: Decisão registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── vehicles ─────────────────────────────
  /vehicles/nearby:
    get:
      tags: [vehicles]
      operationId: listNearbyVehicles
      summary: Motos próximas
      description: |
        Motos disponíveis (`free`) dentro do raio, ordenadas por distância (PostGIS). Para staff, inclui
        todos os status. `minRangeKm` filtra pela autonomia estimada.

        Retirada em galpão: para o cliente, exclui motos com `depotId` (ficam no galpão e só saem pela entrega,
        `GET /depots/{id}/vehicles`) e motos `awaiting_pickup` (esperando recolhimento). Staff continua vendo todas.
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte, campo]
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
          example: -23.56
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
          example: -46.69
        - name: radiusM
          in: query
          description: Raio em metros.
          schema: { type: integer, minimum: 50, maximum: 5000, default: 1000 }
        - name: minRangeKm
          in: query
          description: Autonomia mínima estimada, em km.
          schema: { type: number, format: double, minimum: 0, maximum: 200 }
      responses:
        '200':
          description: Motos encontradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyVehicles' }
              example:
                items:
                  - id: 3f1c2a9e-7b1d-4c55-9a51-0b7d4f6e8a01
                    code: VLT-0001
                    model: Volti S1
                    status: free
                    lat: -23.5614
                    lng: -46.6907
                    batteryPct: 84
                    estimatedRangeKm: 42
                    distanceM: 120
                  - id: 8b0f9d3c-2e4a-4f7b-8c61-5d2e9a7b1c02
                    code: VLT-0002
                    model: Volti S1
                    status: free
                    lat: -23.5598
                    lng: -46.6881
                    batteryPct: 37
                    estimatedRangeKm: 18
                    distanceM: 340
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /vehicles/by-code/{code}:
    get:
      tags: [vehicles]
      operationId: getVehicleByCode
      summary: Moto pelo código (QR ou número)
      description: Aceita o código impresso (`VLT-0001`), só o número (`0001` ou `1`) ou o conteúdo do QR (`volti://v/VLT-0001`, URL-encoded).
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte, campo]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
          example: VLT-0001
      responses:
        '200':
          description: Moto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: Listar frota
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte, campo]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/VehicleStatus' }
        - name: q
          in: query
          description: Busca por código, thingName, QR ou nome do modelo.
          schema: { type: string, maxLength: 64 }
        - name: depotId
          in: query
          description: Só motos deste galpão (`depotId` da moto).
          schema: { type: string, format: uuid }
        - name: vehicleModelId
          in: query
          description: Só motos deste modelo do catálogo.
          schema: { type: string, format: uuid }
        - name: maxBatteryPct
          in: query
          description: Só motos com bateria até este valor (fila de troca de bateria).
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Página de motos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehiclePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Cadastrar moto
      description: |
        Sem `depotId` a moto nasce `maintenance` na posição padrão. Com `depotId` (galpão existente e ativo) nasce `free`
        no galpão, com `lat`/`lng` do galpão — disponível para retirada. Galpão inexistente → `404`; inativo → `422`
        `depot-inactive`. `qrCode` vazio vira `volti://v/{code}`.

        `batterySerial`: série nova é cadastrada instalada nesta moto; série de uma bateria `charged` e livre (no galpão,
        sem moto) é instalada nesta moto (movimentação gravada); bateria em qualquer outra situação → `409`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreate' }
      responses:
        '201':
          description: Moto criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /vehicles/{id}:
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Ficha da moto
      description: Clientes recebem só os campos públicos; staff recebe também telemetria e dados do rastreador.
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Moto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Editar moto
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleUpdate' }
      responses:
        '200':
          description: Moto atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /vehicles/{id}/status:
    post:
      tags: [vehicles]
      operationId: setVehicleStatus
      summary: Mudar status operacional (manutenção ou disponível)
      description: Só entre `free` e `maintenance`, e só sem aluguel ou reserva ativa (senão `409`). Moto com bloqueio da equipe ou do sistema (cerca, hold, modo roubada) não volta a `free` (`409` `vehicle-unavailable`, "A moto está bloqueada pela equipe; libere-a antes de devolver à frota."). Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleStatusChange' }
      responses:
        '200':
          description: Status alterado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /vehicles/{id}/transfer-depot:
    post:
      tags: [vehicles]
      operationId: transferVehicleDepot
      summary: Transferir a moto de galpão
      description: |
        Move a moto para outro galpão (existente e ativo): `depotId` e `lat`/`lng` passam a ser os do galpão. Só moto
        `free` ou `maintenance`, sem aluguel aberto nem reserva ativa (senão `409` `vehicle-unavailable`); já no mesmo
        galpão → `409`. Galpão inexistente → `404`; inativo → `422` `depot-inactive`. Grava AuditLog
        (`vehicle.transfer_depot`, com o motivo e os galpões de origem e destino).
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleDepotTransfer' }
      responses:
        '200':
          description: Moto transferida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /vehicles/{id}/track:
    get:
      tags: [vehicles]
      operationId: getVehicleTrack
      summary: Trajeto da moto no período (replay)
      description: Pontos gravados durante aluguéis (LGPD — fora de aluguel não há trajeto). Janela máxima de 7 dias; retenção de 90 dias.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
      responses:
        '200':
          description: Trajeto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /vehicles/{id}/ring:
    post:
      tags: [vehicles]
      operationId: ringVehicle
      summary: Buzinar e piscar (cliente)
      description: Ajuda o cliente a achar a moto. Só para a moto da reserva ou do aluguel ativo do próprio cliente (senão `403`). Gera um comando `horn`.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '202':
          description: Comando aceito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleCommand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── commands ─────────────────────────────
  /vehicles/{id}/commands:
    post:
      tags: [commands]
      operationId: sendVehicleCommand
      summary: Enviar comando à moto
      description: |
        Grava AuditLog (quem, quando, motivo) e delega ao módulo IoT. A resposta é `202` com o comando em
        `pending` ou `in_progress`; a confirmação chega pelo evento `command.updated` (sala `fleet`) ou por
        `GET /commands/{id}`. Moto offline → `pending` com `statusReason: offline`, aplicado ao reconectar.
        `lock` é sempre bloqueio seguro (rampa de limite até parar; trava abaixo de 3 km/h).
        Regras: `speed_limit` exige `speedLimitKmh` (0..32); `stolen_mode` exige `on`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendCommandRequest' }
      responses:
        '202':
          description: Comando aceito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleCommand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [commands]
      operationId: listVehicleCommands
      summary: Histórico de comandos da moto
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de comandos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleCommandPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /commands/{id}:
    get:
      tags: [commands]
      operationId: getCommand
      summary: Estado do comando
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte, campo]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Comando.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleCommand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── catálogo de modelos e estações ─────────────────────────────
  /vehicle-models:
    get:
      tags: [catalog]
      operationId: listVehicleModels
      summary: Catálogo de modelos ("Escolha sua moto")
      description: |
        Modelos ativos em `sortOrder` (staff com `includeInactive=true` vê todos). `pricePerMinuteCents` substitui o
        preço por minuto do plano `minute` para motos do modelo (o desbloqueio e a pausa continuam os do plano, salvo
        `unlockFeeCents`). `photoUrl` é um link assinado (S3/MinIO) válido por 24 h.
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, financeiro, suporte, campo]
      parameters:
        - name: includeInactive
          in: query
          description: Só staff.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Modelos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [catalog]
      operationId: createVehicleModel
      summary: Cadastrar modelo
      security:
        - staffAuth: []
      x-required-groups: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleModelInput' }
      responses:
        '201':
          description: Modelo criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleModel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /vehicle-models/uploads:
    post:
      tags: [catalog]
      operationId: createVehicleModelPhotoUpload
      summary: URL de upload da foto do modelo
      description: Upload direto ao bucket de catálogo (`catalog/<uuid>.<ext>`); depois envie `photoObjectKey` em `PATCH /vehicle-models/{id}`.
      security:
        - staffAuth: []
      x-required-groups: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: URL pré-assinada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /vehicle-models/{id}:
    patch:
      tags: [catalog]
      operationId: updateVehicleModel
      summary: Editar modelo (preço, foto, intervalo de revisão)
      description: Grava AuditLog (`vehicle_model.update`). Mudança de preço vale para aluguéis iniciados depois (o aluguel guarda o preço do início).
      security:
        - staffAuth: []
      x-required-groups: [admin]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleModelUpdate' }
      responses:
        '200':
          description: Modelo atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleModel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /swap-stations:
    get:
      tags: [stations]
      operationId: listSwapStations
      summary: Estações de troca de bateria (mapa)
      description: |
        Estações ativas com posição, endereço, horário e baterias carregadas disponíveis. Com `lat`/`lng`, filtra pelo
        raio e ordena por distância (`distanceM`); sem eles, todas em ordem alfabética.

        Leitura aberta a qualquer cliente autenticado (`customerAuth`, sem grupo: o mapa e a folha "Troca de bateria"
        do app). `x-required-groups` vale só para `staffAuth`. A resposta traz apenas os campos públicos de
        `SwapStation` (identificador, nome, endereço, posição, baterias, vagas, horário e distância); dados internos
        da estação (ativa/inativa, datas de cadastro) não saem desta rota, para nenhum pool; o painel lê o cadastro em
        `GET /swap-stations/registry` (admin/operacao).
      security:
        - customerAuth: []
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte, campo]
      parameters:
        - name: lat
          in: query
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radiusM
          in: query
          description: Raio em metros (só com `lat`/`lng`).
          schema: { type: integer, minimum: 100, maximum: 50000, default: 10000 }
      responses:
        '200':
          description: Estações.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwapStationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [stations]
      operationId: createSwapStation
      summary: Cadastrar estação de troca (painel)
      description: |
        Nome, endereço, posição, horário (`openingHours`, texto livre como "Seg a sáb, 7h às 22h", obrigatório sem
        `open24h`; com `open24h` e sem texto vale "Todos os dias, 24 h"), `totalSlots` (≥ 1) e a *thing* do armário no IoT
        Core (`thingName`, padrão `station-{id}`; formato `station-<uuid>`, o mesmo do provisionamento e da regra IoT).
        `thingName` já usado por outra estação → `409` `thing-name-taken`. A estação nasce com o QR fixo emitido (o mesmo
        código do script `stations:qr`, lido em `GET /swap-stations/{id}/qr`) e sem baterias (`availableBatteries` = 0;
        o estoque entra pela van, `POST /batteries/van-stock/unload`). Grava AuditLog (`swap_station.create`, sem o QR).
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwapStationInput' }
      responses:
        '201':
          description: Estação criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwapStationAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /swap-stations/registry:
    get:
      tags: [stations]
      operationId: listSwapStationRegistry
      summary: Cadastro das estações (painel)
      description: |
        Todas as estações, ativas e inativas, em ordem alfabética, com os campos de cadastro (`SwapStationAdmin`: ativa,
        `thingName`, baterias na estação, trocas em andamento e galpões ligados). Nunca traz o QR (`stationCode`).
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      responses:
        '200':
          description: Estações.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwapStationAdminList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /swap-stations/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    patch:
      tags: [stations]
      operationId: updateSwapStation
      summary: Editar ou desativar estação de troca (painel)
      description: |
        Campos ausentes não mudam. Validações:
        - `totalSlots` menor que as baterias na estação (o maior entre `availableBatteries` e as baterias `in_station`
          dela) → `422` `slots-below-stock`;
        - `thingName` de outra estação → `409` `thing-name-taken`;
        - desativar (`active: false`) ou trocar o `thingName` com troca por QR em andamento na estação → `409`
          `station-swap-in-progress` (espere terminar; a desativação e a criação de troca se serializam pela linha da
          estação).
        Estação inativa some de `GET /swap-stations` e recusa troca nova (`422` `station-unavailable`). O QR não muda.
        Grava AuditLog (`swap_station.update`, nomes dos campos).
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwapStationUpdate' }
      responses:
        '200':
          description: Estação atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwapStationAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /swap-stations/{id}/swaps:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [stations]
      operationId: createStationSwap
      summary: Iniciar troca de bateria na estação (QR)
      description: |
        O cliente escaneou o QR fixo da estação (`stationCode`, código assinado sem dado pessoal) com um aluguel em andamento.
        A API valida, nesta ordem:
        - QR inválido, adulterado ou de outra estação (o `id` do caminho tem que ser a estação do QR) → `404`
          `station-not-found`;
        - aluguel do próprio cliente (senão `404`) e `active` ou `paused` → senão `409` `rental-not-active`;
        - uma troca aberta por aluguel → `409` `swap-open`;
        - estação ativa, aberta (`open24h` ou dentro de `openingHours` quando o texto é interpretável, no fuso
          America/Sao_Paulo) e com bateria carregada livre (`availableBatteries` menos as trocas em andamento) → senão
          `422` `station-unavailable`;
        - celular (`lat`/`lng`) a no máximo 50 m da estação → senão `422` `too-far`. A posição só é usada nesta
          validação (LGPD): a troca guarda apenas a distância;
        - moto parada: velocidade 0 conhecida e recente, moto travada ou aluguel pausado. Velocidade desconhecida conta
          como em movimento → `422` `vehicle-moving`.

        Sucesso → `201` com a troca em `opening_slot`; a estação abre uma vaga vazia. A partir daí o status avança pelos
        eventos da estação (`station_swap.updated` no WebSocket): `awaiting_return` (vaga aberta, `slotNumber`) →
        `returned` (bateria devolvida) → `releasing` (vaga fechada, estação libera a carregada) → `completed`. Cada etapa
        tem prazo de 3 min (`expiresAt`): sem resposta da estação → `failed`; sem devolução → `canceled`; nenhuma bateria
        é liberada sem a devolução registrada.

        Taxa (`feeCents`, congelada aqui): 0 nos planos `day`, `weekly` e `monthly`; nos planos `minute` e `hour`, a taxa
        de sistema `battery_swap_fee` (padrão 500, editável em `PUT /pricing/fees/{id}`). Não é cobrada na hora: entra
        como linha `battery_swap_fee` no `breakdown` do fechamento do aluguel, só para trocas `completed`.

        Idempotência: a mesma `Idempotency-Key` devolve a mesma troca e não abre outra vaga.
      security:
        - customerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationSwapRequest' }
      responses:
        '201':
          description: Troca iniciada (`opening_slot`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationSwap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [stations]
      operationId: listStationSwaps
      summary: Trocas da estação (painel)
      description: Mais recentes primeiro, com nº de série devolvido/liberado. Estação inexistente → `404` `station-not-found`.
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StationSwapStatus' }
      responses:
        '200':
          description: Página de trocas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationSwapPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /swap-stations/{id}/qr:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [stations]
      operationId: getSwapStationQr
      summary: QR da estação (admin e operação)
      description: |
        Conteúdo do QR fixo da estação (`stationCode`, o mesmo código que o script `stations:qr` grava) para imprimir o
        adesivo pelo painel. Estação ainda sem código → emitido agora com o segredo atual. Grava AuditLog (sem o código).
        Reemissão em massa (troca do segredo) é pelo script de operação `stations:qr --reissue` (ver
        `services/api/README.md`). O código nunca sai em `SwapStation`, em `SwapStationAdmin` nem para o cliente.
      security:
