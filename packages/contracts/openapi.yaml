        qualifiedCount: { type: integer, minimum: 0, description: Amigos que já terminaram a primeira corrida. }
        totalEarnedCents: { type: integer, minimum: 0 }
        referredBy: { type: string, description: Primeiro nome de quem indicou o cliente (se houver). }
