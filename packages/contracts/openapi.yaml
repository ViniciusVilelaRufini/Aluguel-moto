          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleRevenueReport' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/finance:
    get:
      tags: [reports]
      operationId: getFinanceReport
      summary: Financeiro (cauções, inadimplência, repasses de seguro)
      security:
        - staffAuth: []
      x-required-groups: [admin, financeiro]
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Relatório (JSON ou CSV conforme `format`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceReport' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── customers ─────────────────────────────
  /customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Buscar clientes
      description: '`q` busca por nome, e-mail, telefone ou CPF. CPF mascarado para quem não é `admin`.'
      security:
        - staffAuth: []
      x-required-groups: [admin, suporte, financeiro]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CustomerStatus' }
        - name: kycStatus
          in: query
          schema: { $ref: '#/components/schemas/KycStatus' }
        - name: delinquent
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Página de clientes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /customer-restrictions:
    get:
      tags: [customers]
      operationId: listRestrictions
      summary: Lista de restrição
      description: CPFs impedidos de criar conta ou alugar.
      security:
        - staffAuth: []
      x-required-groups: [admin, suporte]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página da lista de restrição.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictionEntryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [customers]
      operationId: addRestriction
      summary: Incluir CPF na lista de restrição
      description: Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, suporte]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestrictionEntryCreate' }
      responses:
        '201':
          description: CPF incluído.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictionEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customer-restrictions/{id}:
    delete:
      tags: [customers]
      operationId: removeRestriction
      summary: Remover CPF da lista de restrição
      description: Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: CPF removido.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /customers/{id}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Ficha do cliente
      security:
        - staffAuth: []
      x-required-groups: [admin, suporte, financeiro]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /customers/{id}/block:
    post:
      tags: [customers]
      operationId: blockCustomer
      summary: Bloquear conta
      description: Impede novas reservas e aluguéis (aluguel em andamento continua até o fim). Opcionalmente inclui o CPF na lista de restrição. Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerBlockRequest' }
      responses:
        '200':
          description: Conta bloqueada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers/{id}/unblock:
    post:
      tags: [customers]
      operationId: unblockCustomer
      summary: Desbloquear conta
      description: Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin, suporte]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Conta desbloqueada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers/{id}/delinquency/clear:
    post:
      tags: [customers]
      operationId: clearCustomerDelinquency
      summary: Registrar quitação manual da inadimplência
      description: |
        O financeiro registra que a dívida foi paga fora do app (ex.: transferência, acordo). Marca como quitados
        (`debtSettledAt`, `debtSettlement: manual`) todos os pagamentos `failed` de aluguel/assinatura ainda em aberto e
        tira a flag `delinquent`. Grava AuditLog com o motivo e o valor quitado; os recibos dos aluguéis quitados ficam
        prontos. Cliente sem inadimplência → `409` `debt-not-payable`; cobrança ainda em retentativa automática no gateway
        → `409` `debt-in-collection` (liquidação de aluguel retentando ou a assinatura ligada a uma das dívidas em
        `past_due`/cancelamento pendente; outra assinatura do cliente não bloqueia), para não cobrar de novo o que foi pago fora.
      security:
        - staffAuth: []
      x-required-groups: [admin, financeiro]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelinquencyClearRequest' }
      responses:
        '200':
          description: Inadimplência quitada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── staff ─────────────────────────────
  /staff:
    get:
      tags: [staff]
      operationId: listStaffUsers
      summary: Usuários internos
      description: '`operacao` e `suporte` usam para escolher responsáveis (tarefas, alertas).'
      security:
        - staffAuth: []
      x-required-groups: [admin, operacao, suporte]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: group
          in: query
          schema: { $ref: '#/components/schemas/StaffGroup' }
        - name: active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Página de usuários internos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [staff]
      operationId: createStaffUser
      summary: Convidar usuário interno
      description: Cria o usuário no pool interno (MFA obrigatório no primeiro acesso) e envia o convite. Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffUserCreate' }
      responses:
        '201':
          description: Usuário criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/{id}:
    get:
      tags: [staff]
      operationId: getStaffUser
      summary: Detalhe do usuário interno
      security:
        - staffAuth: []
      x-required-groups: [admin]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuário interno.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [staff]
      operationId: updateStaffUser
      summary: Alterar grupos ou desativar usuário interno
      description: Um admin não remove o próprio grupo `admin` nem se desativa (`409`). Grava AuditLog.
      security:
        - staffAuth: []
      x-required-groups: [admin]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffUserUpdate' }
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── audit ─────────────────────────────
  /audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: Log de auditoria
      description: Todos os comandos e alterações sensíveis (quem, quando, motivo). Somente leitura.
      security:
        - staffAuth: []
      x-required-groups: [admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: 'Prefixo da ação, ex.: `vehicle.command`.'
          schema: { type: string, maxLength: 100 }
        - name: entityType
          in: query
          schema: { type: string, maxLength: 50 }
        - name: entityId
          in: query
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Página de registros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── lgpd ─────────────────────────────
  /lgpd/consents:
    get:
      tags: [lgpd]
      operationId: getConsents
      summary: Consentimentos do cliente
      security:
        - customerAuth: []
      responses:
        '200':
          description: Consentimentos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consents' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [lgpd]
      operationId: updateConsents
      summary: Registrar consentimentos (termos e localização)
      description: O onboarding exige `termsAccepted` e `locationTracking` verdadeiros para seguir. Sem consentimento de localização, `POST /rentals` é recusado (`403` `location-consent-required`); reservar não exige o consentimento.
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentsUpdate' }
      responses:
        '200':
          description: Consentimentos registrados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consents' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /lgpd/export:
    get:
      tags: [lgpd]
      operationId: exportMyData
      summary: Exportar meus dados
      description: Todos os dados pessoais do próprio cliente (e somente dele), incluindo trajetos ainda não expirados.
      security:
        - customerAuth: []
      responses:
        '200':
          description: Exportação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LgpdExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /lgpd/account:
    delete:
      tags: [lgpd]
      operationId: deleteMyAccount
      summary: Excluir minha conta
      description: |
        Anonimiza nome, CPF, e-mail e telefone, apaga trajetos e documentos de KYC e mantém pagamentos e
        notas fiscais (obrigação legal). Bloqueado (`409` `account-deletion-blocked`, com `detail` em pt-BR dizendo o que
        fazer) com: aluguel em andamento; reserva aberta (inclusive retirada em galpão `active` ou com a entrega em
        andamento, `handover`); caução ainda retida ou aguardando Pix; débito pendente ou cobrança em curso.
      security:
        - customerAuth: []
      responses:
        '202':
          description: Exclusão aceita.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    customerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT do User Pool de clientes (Cognito) ou de `POST /dev/token` com `pool=customer`.
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT do User Pool interno (MFA), com `cognito:groups`, ou de `POST /dev/token` com `pool=staff`.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SwapId:
      name: swapId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `nextCursor` da página anterior.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      description: Início do período (inclusive), UTC.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Fim do período (exclusivo), UTC.
      schema: { type: string, format: date-time }
    FromRequired:
      name: from
      in: query
      required: true
      description: Início do período (inclusive), UTC.
      schema: { type: string, format: date-time }
    ToRequired:
      name: to
      in: query
      required: true
      description: Fim do período (exclusivo), UTC.
      schema: { type: string, format: date-time }
    ReportFormat:
      name: format
      in: query
      description: '`csv` devolve `text/csv` para planilha em pt-BR: separador `;`, UTF-8 com BOM, cabeçalhos em português, valores em reais com vírgula (`1234,56`) e datas no fuso America/Sao_Paulo (`dd/mm/aaaa`, com hora no agrupamento por hora). O JSON continua em centavos e UTC.'
      schema: { $ref: '#/components/schemas/ReportFormat' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única por intenção (UUID v4 recomendado). Válida por 24 h.
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Recomendado para reenvios da fila offline. Válida por 24 h.
      schema: { type: string, minLength: 8, maxLength: 128 }

    ShareToken:
      name: token
      in: path
      required: true
      description: Token do link de localização compartilhada (base64url, 32 caracteres).
      schema: { type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }

  responses:
    BadRequest:
      description: Requisição inválida (validação de entrada).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.volti.com.br/problems/validation-error
            title: Dados inválidos
            status: 400
            detail: speedLimitKmh deve ser no máximo 32.
            errors:
              - field: speedLimitKmh
                message: Máximo de 32 km/h
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sem permissão (grupo, dono do recurso ou regra de negócio como KYC/inadimplência).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito com o estado atual do recurso.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Regra de negócio impede a operação.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PaymentRequired:
      description: Pagamento recusado pelo gateway (`payment-failed`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: 'Gateway de pagamento indisponível (`gateway-unavailable`); nada foi alterado, tente de novo.'
      headers:
        Retry-After:
          description: Segundos sugeridos até tentar de novo.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite de requisições excedido.
      headers:
        Retry-After:
          description: Segundos até poder tentar de novo.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ───────────── enums compartilhados (nomes fixos do plano mestre) ─────────────
    VehicleStatus:
      type: string
      enum: [free, rented, reserved, paused, blocked, maintenance, offline, awaiting_pickup]
      description: |
        Mesmas cores de `--status-*` do design system. Retirada em galpão: disponível = `free` com `depotId`;
        `reserved` = separada para uma reserva; `awaiting_pickup` = devolvida em ponto verde, esperando o operador
        recolher ao galpão (não alugável).
    ZoneType:
      type: string
      enum: [operation, return, forbidden, reduced_speed]
    StaffGroup:
      type: string
      enum: [admin, operacao, financeiro, suporte, campo]
    RentalStatus:
      type: string
      enum: [active, paused, ending, ended, force_ended]
    CommandType:
      type: string
      enum: [lock, unlock, horn, speed_limit, stolen_mode]
    CommandStatus:
      type: string
      enum: [pending, in_progress, confirmed, failed]
    PlanCode:
      type: string
      enum: [minute, hour, day, weekly, monthly]
    InsuranceCoverage:
      type: string
      enum: [basic, full]
    KycStatus:
      type: string
      enum: [not_started, pending, approved, rejected]

    # ───────────── demais enums ─────────────
    CommandStatusReason:
      type: string
      enum: [offline, timeout, did_not_stop, invalid_limit, locked_by_staff]
      description: 'Motivo do estado do comando (`CommandOutcome.reason` da porta IoT). No WebSocket `command.updated` aparece como `reason`. `locked_by_staff`: destravar pedido por cliente ou campo recusado (trava da equipe ou do sistema, limite segurado em 0 ou modo roubada); nada é publicado e só admin/operacao desfaz.'
    AuthPool:
      type: string
      enum: [customer, staff]
    DocumentType:
      type: string
      enum: [rg, cnh, rne]
    UploadContentType:
      type: string
      enum: [image/jpeg, image/png, image/heic, application/pdf]
    KycDecision:
      type: string
      enum: [approved, rejected]
    DevicePlatform:
      type: string
      enum: [android, ios, web]
    HealthState:
      type: string
      enum: [ok, degraded, down]
    ServiceVehicleStatus:
      type: string
      enum: [free, maintenance]
      description: Subconjunto de `VehicleStatus` que o time pode definir manualmente.
    GeoJsonPolygonType:
      type: string
      enum: [Polygon]
    ReservationStatus:
      type: string
      enum: [active, converted, canceled, expired, handover]
      description: '`handover` = reserva de galpão com entrega aberta, aguardando o aceite do cliente.'
    DepositMethod:
      type: string
      enum: [card, pix]
    DepositStatus:
      type: string
      enum: [awaiting_pix, held, failed, captured, released]
      description: '`held`/`awaiting_pix`/`failed` vêm de `RentalBillingPort.holdDeposit`; `captured`/`released` no encerramento.'
    RentalStartOutcome:
      type: string
      enum: [started, awaiting_deposit]
    RentalEventType:
      type: string
      enum: [started, paused, resumed, vehicle_swapped, zone_entered, zone_exited, left_operation_area, returned_operation_area, alert, fall_detected, ending, ended, force_ended, command]
    ActorType:
      type: string
      enum: [customer, staff, system]
    PlanUnit:
      type: string
      enum: [minute, hour, day, week, month]
    DiscountType:
      type: string
      enum: [percent, fixed]
    PaymentStatus:
      type: string
      enum: [pending, authorized, captured, canceled, paid, refunded, partially_refunded, failed]
      description: '`pending → authorized → captured | canceled`; `pending → paid`; `paid | captured → refunded | partially_refunded`; `* → failed`.'
    PaymentKind:
      type: string
      enum: [rental, deposit, top_up, subscription, fee, debt_settlement]
      description: '`debt_settlement`: quitação de uma dívida pelo cliente (`POST /payments/{id}/retry`), com `settlesPaymentId`.'
    PaymentMethod:
      type: string
      enum: [card, pix, wallet]
    TopUpMethod:
      type: string
      enum: [card, pix]
    TopUpStatus:
      type: string
      enum: [pending, paid, failed, expired]
    SubscriptionPlanCode:
      type: string
      enum: [weekly, monthly]
      description: Subconjunto recorrente de `PlanCode`.
    SubscriptionStatus:
      type: string
      enum: [active, past_due, canceled, expired, paused]
      description: '`paused`: pausada pelo cliente (`POST /payments/subscriptions/{id}/pause`); aluguéis no plano não são cobertos.'
    WalletEntryType:
      type: string
      enum: [top_up, minute_package, rental_charge, refund, adjustment, bonus]
    PolicyStatus:
      type: string
      enum: [active, canceled, expired]
    AlertType:
      type: string
      enum: [out_of_operation_area, forbidden_zone_entered, fall_detected, tamper, battery_critical, movement_without_rental, vehicle_offline, command_failed, customer_not_ok, incident_reported, speed_limiter_noncompliant, battery_stock_low, payment_needs_review]
      description: |
        `battery_stock_low`: baterias `charged` de um galpão abaixo de `Depot.minChargedBatteries` (um aberto por galpão, `depotId`).
        `payment_needs_review`: pagamento que exige revisão manual do financeiro (liquidação estacionada, estorno recusado em
        `needs_review`, cobrança tardia de assinatura sem estorno automático); `paymentId` aponta o pagamento (um aberto por pagamento).
    AlertPriority:
      type: string
      enum: [low, medium, high, critical]
    AlertStatus:
      type: string
      enum: [open, assigned, resolved]
    IncidentCategory:
      type: string
      enum: [vehicle_problem, accident, theft, app_problem, parking, other]
    IncidentStatus:
      type: string
      enum: [open, in_progress, resolved, closed]
    DisputeStatus:
      type: string
      enum: [open, under_review, accepted, rejected]
    DisputeDecision:
      type: string
      enum: [accepted, rejected]
    ClaimType:
      type: string
      enum: [accident, theft, damage, personal_injury]
    ClaimStatus:
      type: string
      enum: [submitted, under_review, approved, rejected, paid]
    ConversationStatus:
      type: string
      enum: [open, closed]
    MessageAuthorType:
      type: string
      enum: [customer, staff, system]
    FieldTaskType:
      type: string
      enum: [collect, battery_swap, maintenance, reposition, inspection]
    FieldTaskStatus:
      type: string
      enum: [open, assigned, in_progress, done, canceled]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
    MaintenanceKind:
      type: string
      enum: [preventive, corrective]
    MaintenanceStatus:
      type: string
      enum: [scheduled, in_progress, done, canceled]
    CustomerStatus:
      type: string
      enum: [active, blocked, deleted]
    ReportGroupBy:
      type: string
      enum: [hour, day, week, month]
      default: day
    ReportFormat:
      type: string
      enum: [json, csv]
      default: json
    AccountDeletionStatus:
      type: string
      enum: [scheduled, completed]

    # ───────────── comuns ─────────────
    Problem:
      type: object
      description: Erro no formato RFC 7807 (`application/problem+json`).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: '`https://api.volti.com.br/problems/<slug>` (ver a lista de slugs na descrição da API).'
          examples: ['https://api.volti.com.br/problems/rental-outside-return-zone']
        title:
          type: string
          description: Resumo legível (pt-BR).
          examples: [Fora da zona de devolução]
        status:
          type: integer
          examples: [422]
        detail:
          type: string
          description: Explicação desta ocorrência (pt-BR, pode ir para a UI).
        instance:
          type: string
          description: Caminho da requisição.
        code:
          type: string
          description: Slug do `type`, para facilitar o `switch` nos clientes.
          examples: [rental-outside-return-zone]
        traceId:
          type: string
          description: ID de correlação dos logs.
        errors:
          type: array
          description: Erros de validação por campo (só em `validation-error`).
          items: { $ref: '#/components/schemas/ValidationIssue' }
    ValidationIssue:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [speedLimitKmh] }
        message: { type: string, examples: [Máximo de 32 km/h] }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    PresignedUpload:
      type: object
      description: Upload direto para o S3/MinIO. O app faz `PUT uploadUrl` com os `headers` informados e depois envia `objectKey` à API.
      required: [objectKey, uploadUrl, method, headers, expiresAt]
      properties:
        objectKey: { type: string, examples: [kyc/3f1c2a9e/document-front.jpg] }
        uploadUrl: { type: string, format: uri }
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: Cabeçalhos obrigatórios no `PUT` (ex. `Content-Type`).
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    UploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType: { $ref: '#/components/schemas/UploadContentType' }

    # ───────────── health ─────────────
    HealthStatus:
      type: object
      required: [status, version, time]
      properties:
        status: { $ref: '#/components/schemas/HealthState' }
        version: { type: string, examples: [0.1.0] }
        time: { type: string, format: date-time }
        checks:
          type: object
          description: Estado por dependência (`database`, `redis`, `mqtt`, `storage`).
          additionalProperties: { $ref: '#/components/schemas/HealthState' }

    # ───────────── auth ─────────────
    DevTokenRequest:
      type: object
      required: [sub, email, groups, pool]
      properties:
        sub: { type: string, minLength: 1, maxLength: 128, examples: [dev-customer-approved] }
        email: { type: string, format: email }
        groups:
          type: array
          description: Grupos de staff (vazio para `pool=customer`).
          items: { $ref: '#/components/schemas/StaffGroup' }
        pool: { $ref: '#/components/schemas/AuthPool' }
    DevTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Validade em segundos.
          examples: [3600]
    Me:
      type: object
      required: [id, pool, email, groups]
      properties:
        id: { type: string, format: uuid, description: 'ID interno (Customer.id ou StaffUser.id).' }
        sub: { type: string, description: '`sub` do token.' }
        pool: { $ref: '#/components/schemas/AuthPool' }
        email: { type: string, format: email }
        groups:
          type: array
          description: Grupos de staff (vazio para clientes).
          items: { $ref: '#/components/schemas/StaffGroup' }
        customer: { $ref: '#/components/schemas/Customer' }
        staff: { $ref: '#/components/schemas/StaffUser' }
    MeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, pattern: '^\+[1-9]\d{7,14}$', description: 'E.164, ex. `+5511987654321`.' }
        emergencyContactName: { type: string, maxLength: 120 }
        emergencyContactPhone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        pixRefundKeyType: { $ref: '#/components/schemas/PixKeyType' }
        pixRefundKey:
          type: string
          maxLength: 77
          description: |
            Chave Pix para estornos. Envie junto com `pixRefundKeyType`; validada pelo tipo (`422` `pix-key-invalid`):
            CPF com dígitos verificadores e igual ao CPF da conta, e-mail, celular E.164 `+55` ou chave aleatória (UUID).
            É normalizada (CPF só dígitos, e-mail minúsculo). String vazia remove a chave. Grava AuditLog.
    DeviceRegistration:
      type: object
      required: [fcmToken, platform]
      properties:
        fcmToken: { type: string, minLength: 10, maxLength: 4096 }
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        appVersion: { type: string, maxLength: 32 }

    # ───────────── kyc ─────────────
    KycUploadRequest:
      type: object
      required: [documentType, contentType]
      properties:
        documentType: { $ref: '#/components/schemas/DocumentType' }
        contentType: { $ref: '#/components/schemas/UploadContentType' }
        withBack:
          type: boolean
          default: true
          description: Pede também a URL do verso do documento.
    KycUploads:
      type: object
      required: [documentFront, selfie]
      properties:
        documentFront: { $ref: '#/components/schemas/PresignedUpload' }
        documentBack: { $ref: '#/components/schemas/PresignedUpload' }
        selfie: { $ref: '#/components/schemas/PresignedUpload' }
    KycSubmitRequest:
      type: object
      required: [fullName, cpf, birthDate, documentType, documentFrontObjectKey, selfieObjectKey]
      properties:
        fullName: { type: string, minLength: 3, maxLength: 120 }
        cpf: { type: string, pattern: '^\d{11}$', description: Só dígitos. }
        birthDate: { type: string, format: date }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        documentFrontObjectKey: { type: string }
        documentBackObjectKey: { type: string }
        selfieObjectKey: { type: string }
        livenessSessionId:
          type: string
          description: Sessão de prova de vida do SDK do provedor (quando houver).
    KycStatusResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/KycStatus' }
        reason: { type: string, description: Motivo da reprovação (pt-BR). }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time }
    KycReviewRequest:
      type: object
      required: [decision, reason]
      properties:
        decision: { $ref: '#/components/schemas/KycDecision' }
        reason: { type: string, minLength: 3, maxLength: 500 }

    # ───────────── vehicles ─────────────
    VehicleSummary:
      type: object
      description: Moto no mapa do cliente. Sem dados do rastreador.
      required: [id, code, model, status, lat, lng, batteryPct, estimatedRangeKm]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [VLT-0001] }
        model: { type: string, examples: [Volti S1] }
        status: { $ref: '#/components/schemas/VehicleStatus' }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        batteryPct: { type: integer, minimum: 0, maximum: 100 }
        estimatedRangeKm: { type: number, format: double, minimum: 0, description: Autonomia estimada com a carga atual. }
        distanceM: { type: integer, minimum: 0, description: Distância até o ponto da busca (só em `nearby`). }
        vehicleModelId: { type: string, format: uuid, description: "Modelo no catálogo (`GET /vehicle-models`, com a foto)." }
        categoryLabel: { type: string, examples: [Urbana] }
        pricePerMinuteCents: { type: integer, minimum: 0, examples: [79], description: Preço por minuto do modelo no plano `minute`. }
    NearbyVehicles:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VehicleSummary' }
    Vehicle:
      type: object
      description: Ficha da moto. Campos marcados "staff" só vêm para tokens de staff.
      required: [id, code, model, status, lat, lng, batteryPct, estimatedRangeKm, speedLimitKmh]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [VLT-0001] }
        qrCode: { type: string, description: Conteúdo do QR impresso., examples: ['volti://v/VLT-0001'] }
        model: { type: string, examples: [Volti S1] }
        status: { $ref: '#/components/schemas/VehicleStatus' }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        batteryPct: { type: integer, minimum: 0, maximum: 100 }
        estimatedRangeKm: { type: number, format: double, minimum: 0 }
        speedLimitKmh: { type: integer, minimum: 0, maximum: 32, description: Limite atual aplicado (zona ou comando). }
        thingName: { type: string, description: staff., examples: [moto-0001] }
        trackerId: { type: string, format: uuid, description: staff. }
        batterySerial: { type: string, description: staff. Bateria instalada. }
        online: { type: boolean, description: staff. }
        locked: { type: boolean, description: staff. }
        ignition: { type: boolean, description: staff. }
        speedKmh: { type: number, format: double, minimum: 0, description: staff. Velocidade reportada. }
        signal: { type: integer, minimum: 0, maximum: 5, description: staff. }
        stolenMode: { type: boolean, description: staff. }
        firmwareVersion: { type: string, description: staff. }
        lastSeenAt: { type: string, format: date-time, description: staff. Último sinal. }
        currentRentalId: { type: string, format: uuid, description: staff. }
        vehicleModelId: { type: string, format: uuid }
        categoryLabel: { type: string, examples: [Urbana] }
        pricePerMinuteCents: { type: integer, minimum: 0, examples: [79] }
        address: { type: string, description: Endereço aproximado da posição atual (geocodificação reversa em cache)., examples: ['R. Teodoro Sampaio, 1020 · Pinheiros, São Paulo'] }
        addressUpdatedAt: { type: string, format: date-time }
        odometerKm: { type: number, format: double, minimum: 0, description: staff. }
        usageHours: { type: number, format: double, minimum: 0, description: staff. Horas com ignição ligada. }
        service: { $ref: '#/components/schemas/VehicleServiceInfo' }
        battery: { $ref: '#/components/schemas/Battery' }
        assignedSubscriptionId: { type: string, format: uuid, description: staff. Moto fixa de uma assinatura semanal/mensal. }
        depotId: { type: string, format: uuid, description: 'Galpão de origem/atual. Disponível para retirada = `status: free` com `depotId`.' }
        locationHidden:
          type: boolean
          description: |
            Cliente consultando moto em uso por outra pessoa (alugada, pausada ou reservada por outro cliente): a posição
            é ocultada (LGPD) — `lat`/`lng` vêm `0` e `address` ausente. Nunca vem para staff.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehiclePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
        nextCursor: { type: string }
    VehicleCreate:
      type: object
      required: [code, model, thingName]
      properties:
        code: { type: string, pattern: '^VLT-\d{4,}$', examples: [VLT-0061] }
        model: { type: string, minLength: 1, maxLength: 60 }
        thingName: { type: string, pattern: '^[a-zA-Z0-9:_-]{1,128}$', examples: [moto-0061] }
        qrCode: { type: string, maxLength: 200 }
        batterySerial: { type: string, maxLength: 64, description: 'Série nova (cadastrada instalada) ou de uma bateria `charged` livre no galpão.' }
        vehicleModelId: { type: string, format: uuid, description: Define também `model` (nome do modelo). }
        depotId:
          type: string
          format: uuid
          description: Galpão onde a moto entra. Com ele a moto nasce `free` na posição do galpão (disponível para retirada); sem ele, `maintenance`.
    VehicleDepotTransfer:
      type: object
      required: [depotId, reason]
      properties:
        depotId: { type: string, format: uuid, description: Galpão de destino (existente e ativo). }
        reason: { type: string, minLength: 3, maxLength: 500, description: Motivo (vai para o AuditLog). }
    VehicleUpdate:
      type: object
      properties:
        model: { type: string, minLength: 1, maxLength: 60 }
        thingName: { type: string, pattern: '^[a-zA-Z0-9:_-]{1,128}$' }
        qrCode: { type: string, maxLength: 200 }
        vehicleModelId: { type: string, format: uuid, description: Define também `model` (nome do modelo). }
        odometerKm: { type: number, format: double, minimum: 0, maximum: 1000000, description: Correção manual do odômetro (AuditLog). }
        usageHours: { type: number, format: double, minimum: 0, maximum: 100000, description: Correção manual das horas de uso (AuditLog). }
    VehicleStatusChange:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: '#/components/schemas/ServiceVehicleStatus' }
        reason: { type: string, minLength: 3, maxLength: 500 }
    TrackPoint:
      type: object
      required: [lat, lng, speedKmh, recordedAt]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        speedKmh: { type: number, format: double, minimum: 0 }
        recordedAt: { type: string, format: date-time }
    Track:
      type: object
      required: [vehicleId, points]
      properties:
        rentalId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        points:
          type: array
          items: { $ref: '#/components/schemas/TrackPoint' }

    # ───────────── commands ─────────────
    SendCommandRequest:
      type: object
      required: [type, reason]
      properties:
        type: { $ref: '#/components/schemas/CommandType' }
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Motivo obrigatório (vai para o AuditLog).
        speedLimitKmh:
          type: integer
          minimum: 0
          maximum: 32
          description: Obrigatório quando `type = speed_limit`. Nunca acima de 32 km/h.
        'on':
          type: boolean
          description: Obrigatório quando `type = stolen_mode` (liga/desliga).
    ServiceUnlockRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        fieldTaskId: { type: string, format: uuid }
    VehicleCommand:
      type: object
      required: [id, vehicleId, type, status, reason, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/CommandType' }
        status: { $ref: '#/components/schemas/CommandStatus' }
        statusReason: { $ref: '#/components/schemas/CommandStatusReason' }
        reason: { type: string, description: Motivo informado por quem pediu. }
        speedLimitKmh: { type: integer, minimum: 0, maximum: 32 }
        'on': { type: boolean }
        requestedById: { type: string, format: uuid }
        requestedByName: { type: string }
        requestedByType: { $ref: '#/components/schemas/ActorType' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
    VehicleCommandPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VehicleCommand' }
        nextCursor: { type: string }

    # ───────────── zones ─────────────
    GeoJsonPolygon:
      type: object
      description: 'GeoJSON Polygon (RFC 7946), WGS84, `[lng, lat]`. Primeiro anel = contorno; demais = buracos. Cada anel fechado (primeiro ponto = último), mínimo 4 posições.'
      required: [type, coordinates]
      properties:
        type: { $ref: '#/components/schemas/GeoJsonPolygonType' }
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number, format: double }
    GeoZone:
      type: object
      required: [id, name, type, geometry, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Ciclovia da Faria Lima] }
        type: { $ref: '#/components/schemas/ZoneType' }
        speedLimitKmh:
          type: integer
          minimum: 0
          maximum: 32
          description: Só em `reduced_speed` (6 pedestres, 20 ciclovia; sempre entre 6 e 20).
        geometry: { $ref: '#/components/schemas/GeoJsonPolygon' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GeoZoneInput:
      type: object
      required: [name, type, geometry]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        type: { $ref: '#/components/schemas/ZoneType' }
        speedLimitKmh:
          type: integer
          minimum: 6
          maximum: 32
          description: 'Obrigatório em `reduced_speed` (ausente → 422 `zone-speed-limit-required`; 21 a 32 → 422 `zone-speed-limit-invalid`); ignorado nos demais tipos. Abaixo de 6 (menor limite de zona, área de pedestres) ou acima de 32 → 400.'
        geometry: { $ref: '#/components/schemas/GeoJsonPolygon' }
        active: { type: boolean, default: true }
    GeoZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GeoZone' }

    # ───────────── reservations ─────────────
    ReservationCreate:
      type: object
      description: |
        Só `vehicleId` = reserva de rua (fluxo antigo, 15 min). Com `depotId` = reserva de retirada no galpão: exige
        `pickupMode`, `planCode`, `coverage` e `depositMethod` (`400`), e `pickupAt` em `scheduled`.
      required: [vehicleId]
      properties:
        vehicleId: { type: string, format: uuid }
        depotId: { type: string, format: uuid }
        pickupMode: { $ref: '#/components/schemas/PickupMode' }
        pickupAt: { type: string, format: date-time, description: 'Obrigatório em `scheduled`: dentro do funcionamento e de `maxScheduleDays`.' }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        coverage: { $ref: '#/components/schemas/InsuranceCoverage' }
        depositMethod: { $ref: '#/components/schemas/DepositMethod' }
        cardId: { type: string, format: uuid, description: 'Cartão da caução com `depositMethod: card` (ausente = cartão padrão).' }
        couponCode: { type: string, maxLength: 40, description: Cupom aplicado ao plano na entrega. }
    Reservation:
      type: object
      required: [id, vehicleId, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        vehicle: { $ref: '#/components/schemas/VehicleSummary' }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: |
            Base da contagem regressiva no app. Galpão: `now` → criação + `pickupNowWindowMinutes`; `scheduled` →
            `pickupAt` + `scheduledGraceMinutes`.
        depotId: { type: string, format: uuid, description: Só em reserva de galpão. }
        pickupMode: { $ref: '#/components/schemas/PickupMode' }
        pickupAt: { type: string, format: date-time }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        coverage: { $ref: '#/components/schemas/InsuranceCoverage' }
        depositMethod: { $ref: '#/components/schemas/DepositMethod' }
        deposit: { $ref: '#/components/schemas/Deposit' }
        pickupCode:
          type: string
          description: |
            Conteúdo do QR de retirada (assinado, curto, sem dado pessoal). Só na resposta ao cliente dono da reserva.
          examples: [v1.6c1f0a52-8f3e-4b8e-9d55-0d6a7f1e2c11.1792663200.Zm9vYmFy]
        handoverId: { type: string, format: uuid, description: 'Entrega aberta ou concluída (status `handover`/`converted`).' }
        customerFirstName: { type: string, description: 'staff. Só o primeiro nome (agenda de retiradas).', examples: [Ana] }
    CurrentReservation:
      type: object
      properties:
        reservation: { $ref: '#/components/schemas/Reservation' }

    # ───────────── rentals ─────────────
    StartRentalRequest:
      type: object
      required: [vehicleId, planCode, coverage, depositMethod]
      properties:
        vehicleId: { type: string, format: uuid }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        coverage: { $ref: '#/components/schemas/InsuranceCoverage' }
        depositMethod: { $ref: '#/components/schemas/DepositMethod' }
        couponCode: { type: string, maxLength: 32 }
        cardId:
          type: string
          format: uuid
          description: Cartão para a caução e a cobrança final (padrão do cliente se ausente).
        depositId:
          type: string
          format: uuid
          description: Caução Pix já paga (segunda chamada do fluxo Pix).
        useWalletCredits:
          type: boolean
          default: false
          deprecated: true
          description: |
            Ignorado (R2-01, Task 16 das lacunas): no fechamento a carteira sempre abate primeiro (ordem carteira → caução →
            cartão → dívida), com a linha `wallet` no `breakdown`.
    PixCharge:
      type: object
      required: [chargeId, qrCodeBase64, copyPaste, expiresAt]
      properties:
        chargeId: { type: string }
        qrCodeBase64: { type: string, description: PNG do QR em base64. }
        copyPaste: { type: string, description: Código "copia e cola". }
        expiresAt: { type: string, format: date-time }
    Deposit:
      type: object
      required: [id, customerId, method, status, amountCents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        rentalId: { type: string, format: uuid, description: Aluguel (ou o ID já reservado para ele no fluxo Pix). }
        customerId: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/DepositMethod' }
        status: { $ref: '#/components/schemas/DepositStatus' }
        amountCents: { type: integer, minimum: 0, examples: [5000] }
        capturedCents: { type: integer, minimum: 0 }
        pix: { $ref: '#/components/schemas/PixCharge' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DepositPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Deposit' }
        nextCursor: { type: string }
    RentalStartResult:
      type: object
      required: [outcome, deposit]
      properties:
        outcome: { $ref: '#/components/schemas/RentalStartOutcome' }
        rental: { $ref: '#/components/schemas/Rental' }
        deposit: { $ref: '#/components/schemas/Deposit' }
    PriceLine:
      type: object
      required: [code, description, amountCents]
      properties:
        code:
          type: string
          description: '`unlock`, `time`, `pause`, `insurance`, `coupon`, `fee:<code>`, `subscription_covered`, `wallet`.'
          examples: [time]
        description: { type: string, examples: ['10 min x R$ 0,79'] }
        quantity: { type: integer, minimum: 0, description: 'Minutos, horas ou dias cobrados.' }
        unitCents: { type: integer }
        amountCents: { type: integer, description: Negativo para descontos. }
    PriceBreakdown:
      type: object
      required: [lines, subtotalCents, discountCents, insuranceCents, feesCents, totalCents]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/PriceLine' }
        subtotalCents: { type: integer, description: Desbloqueio + tempo + pausa. }
        discountCents: { type: integer, minimum: 0 }
        insuranceCents: { type: integer, minimum: 0 }
        feesCents: { type: integer, minimum: 0 }
        walletAppliedCents: { type: integer, minimum: 0, description: 'Saldo da carteira abatido no fechamento (R2-01: a carteira abate primeiro). `totalCents` já vem descontado.' }
        totalCents: { type: integer, minimum: 0 }
    Rental:
      type: object
      required: [id, customerId, vehicleId, vehicleCode, planCode, coverage, status, startedAt, elapsedSeconds, pausedSeconds, costCents, depositId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid, description: Moto atual (muda após troca). }
        vehicleCode: { type: string, examples: [VLT-0001] }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        coverage: { $ref: '#/components/schemas/InsuranceCoverage' }
        status: { $ref: '#/components/schemas/RentalStatus' }
        startedAt: { type: string, format: date-time }
        pausedAt: { type: string, format: date-time, description: Início da pausa atual. }
        endedAt: { type: string, format: date-time }
        elapsedSeconds: { type: integer, minimum: 0 }
        pausedSeconds: { type: integer, minimum: 0, description: Total em pausa. }
        costCents:
          type: integer
          minimum: 0
          description: Valor parcial estimado durante o aluguel; valor final depois do encerramento.
        breakdown: { $ref: '#/components/schemas/PriceBreakdown' }
        couponCode: { type: string }
        depositId: { type: string, format: uuid }
        insurancePolicyId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid, description: Pagamento da liquidação. }
        endZoneId: { type: string, format: uuid }
        returnPhotoObjectKey: { type: string }
        forceEndReason: { type: string, description: staff. }
        forcedEndById: { type: string, format: uuid, description: staff. }
        rating: { type: integer, minimum: 1, maximum: 5 }
        speedLimitKmh: { type: integer, minimum: 0, maximum: 32, description: Limite em vigor agora. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RentalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Rental' }
        nextCursor: { type: string }
    CurrentRental:
      type: object
      properties:
        rental: { $ref: '#/components/schemas/Rental' }
        currentStationSwap:
          $ref: '#/components/schemas/StationSwap'
          description: Troca de bateria na estação em andamento neste aluguel (ausente quando não há), para o app retomar a tela da troca.
        batterySwapFeeCents:
          type: integer
          minimum: 0
          description: |
            Taxa que uma troca de bateria na estação iniciada agora congelaria (`StationSwap.feeCents`), para o app mostrar
            "Taxa R$ X" na confirmação antes do `POST /swap-stations/{id}/swaps`: 0 nos planos `day`, `weekly` e `monthly`;
            nos planos `minute` e `hour`, o valor da taxa de sistema `battery_swap_fee` (mesma regra da criação da troca).
            Presente sempre que há `rental`.
    RentalEvent:
      type: object
      required: [id, rentalId, type, at, actorType]
      properties:
        id: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/RentalEventType' }
        at: { type: string, format: date-time }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorId: { type: string, format: uuid }
        message: { type: string, description: Texto pt-BR para a linha do tempo. }
        data:
          type: object
          description: 'Detalhes por tipo (ex. `{ zoneId, zoneType, speedLimitKmh }`, `{ fromVehicleId, toVehicleId }`).'
          additionalProperties: true
    RentalEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RentalEvent' }
    SwapVehicleRequest:
      type: object
      required: [newVehicleId, reason]
      properties:
        newVehicleId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
        incidentId: { type: string, format: uuid }
    EndRentalRequest:
      type: object
      required: [returnPhotoObjectKey]
      properties:
        returnPhotoObjectKey: { type: string, description: '`objectKey` devolvido por `createReturnPhotoUpload`.' }
    ForceEndRentalRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    RatingRequest:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }
    LocationShareRequest:
      type: object
      properties:
        durationMinutes: { type: integer, minimum: 15, maximum: 240, default: 60 }
    LocationShare:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    SharedLocation:
      type: object
      description: Só a posição e o horário — nenhum dado pessoal nem da moto.
      required: [lat, lng, recordedAt, expiresAt]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        recordedAt: { type: string, format: date-time, description: Horário da última posição conhecida (UTC). }
        expiresAt: { type: string, format: date-time, description: Fim da validade do link (UTC); o fim do aluguel encerra antes. }
    WellbeingResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        note: { type: string, maxLength: 500 }
    Receipt:
      type: object
      required: [rentalId, number, issuedAt, vehicleCode, planCode, coverage, startedAt, endedAt, durationSeconds, breakdown]
      properties:
        rentalId: { type: string, format: uuid }
        number: { type: string, description: Número do recibo., examples: [VLT-2026-000123] }
        issuedAt: { type: string, format: date-time }
        customerName: { type: string }
        vehicleCode: { type: string }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        coverage: { $ref: '#/components/schemas/InsuranceCoverage' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 0 }
        breakdown: { $ref: '#/components/schemas/PriceBreakdown' }
        paymentId: { type: string, format: uuid, description: 'Pagamento do aluguel (o `id` de `POST /payments/{id}/retry` quando `paymentStatus` é `pending`).' }
        paymentStatus: { $ref: '#/components/schemas/ReceiptPaymentStatus' }
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          description: Forma do valor recebido (a da quitação, quando a dívida foi paga depois). Ausente enquanto não pago e na quitação manual.
        cardLast4: { type: string, pattern: '^\d{4}$' }
        depositUsedCents: { type: integer, minimum: 1, description: 'Parte da caução usada para abater o valor (caução capturada). Ausente quando a caução não foi usada.' }
        depositReleasedCents: { type: integer, minimum: 0, description: 'Parte da caução devolvida/liberada ao cliente depois do fechamento.' }
        amountDueCents: { type: integer, minimum: 1, description: 'Só com `paymentStatus` `pending`: saldo a pagar (o `outstandingCents` do pagamento).' }
        pdfUrl: { type: string, format: uri, description: 'URL pré-assinada do PDF (expira em 15 min). Só com `paymentStatus` `paid`.' }
        invoiceNumber: { type: string, description: 'Número da NFS-e, quando emitida.' }
        track:
          type: array
          items: { $ref: '#/components/schemas/TrackPoint' }

    ReceiptPaymentStatus:
      type: string
      enum: [paid, pending, processing]
      description: |
        `paid`: recebido (cobrança aprovada, carteira/caução cobriram tudo ou dívida quitada pelo cliente ou pelo
        financeiro); `pending`: dívida em aberto que o cliente paga no app (`amountDueCents`); `processing`: a cobrança
        ainda está em andamento no gateway (retentativa ou análise), nada a pagar por enquanto.

    # ───────────── pricing ─────────────
    PricingPlan:
      type: object
      description: |
        Regras do seed: `minute` desbloqueio 300 + 79/min (minuto parcial arredonda para cima), pausa 20/min;
        `hour` 2900 por hora iniciada; `day` 8900 por dia iniciado; `weekly` 24900 e `monthly` 79900 recorrentes.
      required: [id, code, name, unit, unlockFeeCents, unitPriceCents, pausePerMinuteCents, recurring, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/PlanCode' }
        name: { type: string, examples: [Por minuto] }
        description: { type: string }
        unit: { $ref: '#/components/schemas/PlanUnit' }
        unlockFeeCents: { type: integer, minimum: 0, examples: [300] }
        unitPriceCents: { type: integer, minimum: 0, examples: [79] }
        pausePerMinuteCents: { type: integer, minimum: 0, examples: [20] }
        recurring: { type: boolean }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PricingPlanInput:
      type: object
      required: [code, name, unit, unlockFeeCents, unitPriceCents, pausePerMinuteCents, recurring]
      properties:
        code: { $ref: '#/components/schemas/PlanCode' }
        name: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        unit: { $ref: '#/components/schemas/PlanUnit' }
        unlockFeeCents: { type: integer, minimum: 0 }
        unitPriceCents: { type: integer, minimum: 0 }
        pausePerMinuteCents: { type: integer, minimum: 0 }
        recurring: { type: boolean }
        active: { type: boolean, default: true }
    PricingPlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PricingPlan' }
    QuoteRequest:
      type: object
      required: [planCode, coverage]
      properties:
        planCode: { $ref: '#/components/schemas/PlanCode' }
        coverage: { $ref: '#/components/schemas/InsuranceCoverage' }
        couponCode: { type: string, maxLength: 32 }
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 44640
          description: Duração prevista para estimar o valor (padrão 30 no plano `minute`, 1 unidade nos demais).
        vehicleId: { type: string, format: uuid, description: Usa o preço por minuto do modelo da moto (plano `minute`). }
    Quote:
      type: object
      required: [planCode, coverage, breakdown, depositCents, couponApplied]
      properties:
        planCode: { $ref: '#/components/schemas/PlanCode' }
        coverage: { $ref: '#/components/schemas/InsuranceCoverage' }
        breakdown: { $ref: '#/components/schemas/PriceBreakdown' }
        depositCents: { type: integer, minimum: 0, examples: [5000] }
        couponApplied: { type: boolean }
        couponMessage: { type: string, description: Motivo quando o cupom não se aplica (pt-BR). }
    Coupon:
      type: object
      required: [id, code, discountType, active, redemptions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [BEMVINDO20] }
        description: { type: string }
        discountType: { $ref: '#/components/schemas/DiscountType' }
        percentOff: { type: integer, minimum: 1, maximum: 100, description: 'Quando `discountType = percent`.' }
        amountOffCents: { type: integer, minimum: 1, description: 'Quando `discountType = fixed`.' }
        planCodes:
          type: array
          description: Planos elegíveis (vazio = todos).
          items: { $ref: '#/components/schemas/PlanCode' }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        maxRedemptions: { type: integer, minimum: 1 }
        maxRedemptionsPerCustomer: { type: integer, minimum: 1 }
        redemptions: { type: integer, minimum: 0 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CouponInput:
      type: object
      required: [code, discountType]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{3,32}$' }
        description: { type: string, maxLength: 200 }
        discountType: { $ref: '#/components/schemas/DiscountType' }
        percentOff: { type: integer, minimum: 1, maximum: 100 }
        amountOffCents: { type: integer, minimum: 1 }
        planCodes:
          type: array
          items: { $ref: '#/components/schemas/PlanCode' }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        maxRedemptions: { type: integer, minimum: 1 }
        maxRedemptionsPerCustomer: { type: integer, minimum: 1 }
        active: { type: boolean, default: true }
    CouponPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Coupon' }
        nextCursor: { type: string }
    Fee:
      type: object
      required: [id, code, name, amountCents, active, system, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z0-9_]{2,60}$', examples: [force_end_outside_return_zone] }
        name: { type: string, examples: [Encerramento fora da zona de devolução] }
        description: { type: string }
        amountCents: { type: integer, minimum: 0, examples: [1500] }
        active: { type: boolean }
        system: { type: boolean, description: Taxa usada por regra do sistema (não pode ser desativada). }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeeInput:
      type: object
      required: [code, name, amountCents]
      properties:
        code: { type: string, pattern: '^[a-z0-9_]{2,60}$' }
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        amountCents: { type: integer, minimum: 0 }
        active: { type: boolean, default: true }
    FeeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Fee' }

    # ───────────── payments ─────────────
    PaymentCardCreate:
      type: object
      required: [cardToken]
      properties:
        cardToken: { type: string, minLength: 8, maxLength: 512, description: Token do SDK do gateway. Nunca o número do cartão. }
        setDefault: { type: boolean, default: true }
    PaymentCard:
      type: object
      required: [id, brand, last4, expMonth, expYear, isDefault, createdAt]
      properties:
        id: { type: string, format: uuid }
        brand: { type: string, examples: [visa] }
        last4: { type: string, pattern: '^\d{4}$' }
        expMonth: { type: integer, minimum: 1, maximum: 12 }
        expYear: { type: integer, minimum: 2000 }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
    PaymentCardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PaymentCard' }
    Payment:
      type: object
      required: [id, customerId, kind, method, status, amountCents, refundedCents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        depositId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PaymentKind' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amountCents: { type: integer, minimum: 0 }
        refundedCents: { type: integer, minimum: 0 }
        cardLast4: { type: string, pattern: '^\d{4}$' }
        failureReason: { type: string }
        providerPaymentId: { type: string, description: staff. ID no gateway. }
        receiptUrl: { type: string, format: uri }
        customerName: { type: string, description: staff. Nome do cliente (detalhe e listas do painel). }
        outstandingCents:
          type: integer
          minimum: 0
          description: Saldo devedor de um pagamento `failed` de aluguel/assinatura ainda não quitado (valor − caução capturada como garantia). Ausente quando não há dívida.
        walletCents: { type: integer, minimum: 1, description: 'Aluguel: parte do `amountCents` (bruto) paga com a carteira no fechamento; o restante foi cobrado na caução/gateway. O estorno devolve primeiro a parte do gateway e depois credita a da carteira (lançamento `refund`). Ausente quando a carteira não foi usada.' }
        debtSettledAt: { type: string, format: date-time, description: Dívida deste pagamento quitada (pelo cliente ou manualmente pelo financeiro). }
        debtSettlement: { $ref: '#/components/schemas/DebtSettlementKind' }
        settlesPaymentId: { type: string, format: uuid, description: 'Só em `debt_settlement`: o pagamento cuja dívida esta cobrança quita.' }
        pix: { $ref: '#/components/schemas/PixCharge' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DebtSettlementKind:
      type: string
      enum: [payment, manual]
      description: '`payment`: o cliente pagou (`debt_settlement`); `manual`: o financeiro registrou a quitação (AuditLog com o motivo).'
    DebtPaymentRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [card, pix]
        cardId: { type: string, format: uuid, description: 'Cartão salvo (padrão: o cartão padrão). Só `card`.' }
    DelinquencyClearRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: 'Como a dívida foi paga (ex.: "Transferência recebida em 20/10").' }
    PaymentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        nextCursor: { type: string }
    RefundRequest:
      type: object
      required: [reason]
      properties:
        amountCents: { type: integer, minimum: 1, description: Ausente = estorno do saldo restante. }
        reason: { type: string, minLength: 3, maxLength: 500 }
    Subscription:
      type: object
      required: [id, planCode, status, priceCents, currentPeriodStart, currentPeriodEnd, createdAt]
      properties:
        id: { type: string, format: uuid }
        planCode: { $ref: '#/components/schemas/SubscriptionPlanCode' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        cardId: { type: string, format: uuid }
        priceCents: { type: integer, minimum: 0, examples: [24900] }
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        canceledAt: { type: string, format: date-time }
        nextChargeAt: { type: string, format: date-time, description: Próxima cobrança recorrente (ausente se cancelada ou pausada). }
        nextChargeCents: { type: integer, minimum: 0 }
        cardBrand: { type: string, description: Bandeira do cartão da recorrência. }
        cardLast4: { type: string, pattern: '^\d{4}$' }
        lastPaymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        lastPaymentAt: { type: string, format: date-time }
        pausedAt: { type: string, format: date-time }
        pauseEndsAt: { type: string, format: date-time, description: Retomada automática. }
        maxPauseDays: { type: integer, minimum: 0, description: "Dias por pausa (3 no semanal, 7 no mensal)." }
        pausesRemainingInPeriod: { type: integer, minimum: 0 }
        assignedVehicleId: { type: string, format: uuid, description: Moto fixa do plano. }
        assignedVehicle: { $ref: '#/components/schemas/VehicleSummary' }
        createdAt: { type: string, format: date-time }
    SubscriptionCreate:
      type: object
      required: [planCode]
      properties:
        planCode: { $ref: '#/components/schemas/SubscriptionPlanCode' }
        cardId: { type: string, format: uuid, description: Padrão do cliente se ausente. }
        vehicleId: { type: string, format: uuid, description: "Moto fixa (opcional; mesmas regras de `PUT /payments/subscriptions/{id}/vehicle`)." }
    SubscriptionList:
      type: object
