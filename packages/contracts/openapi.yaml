        priceCents: { type: integer, minimum: 0 }
        active: { type: boolean }
    MinutePackageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MinutePackage' }
    TopUpRequest:
      type: object
      required: [method]
      properties:
        amountCents: { type: integer, minimum: 1000, maximum: 100000, description: 'Crédito em reais (R$ 10 a R$ 1.000). Fora de `Wallet.topUpMinCents..topUpMaxCents` → `422` `top-up-amount-out-of-range`.' }
