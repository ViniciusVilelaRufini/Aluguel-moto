name: volti_flutter
description: Tokens, tema e widgets do Volti Design System, mais cliente de API e autenticacao compartilhados pelos apps Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  dio: ^5.7.0
  lucide_icons_flutter: ^3.0.0
  volti_api:
    path: ../contracts/generated/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: fonts/JetBrainsMono-700.ttf
          weight: 700
